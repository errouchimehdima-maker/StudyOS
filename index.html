<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6366f1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>StudyOS — All-in-One Academic Productivity &amp; Revision Platform</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
/* ==========================================================================
   StudyOS — Production SaaS Design System (Dark & Light Themes)
   ========================================================================== */

:root,
[data-theme="dark"] {
  --bg-app: #090d16;
  --bg-surface: #111827;
  --bg-elevated: #1e293b;
  --bg-hover: #26334d;
  --bg-input: #0f172a;
  --border-subtle: #1f2937;
  --border-strong: #334155;
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --accent: #6366f1;
  --accent-hover: #4f46e5;
  --accent-soft: rgba(99, 102, 241, 0.14);
  --success: #10b981;
  --success-soft: rgba(16, 185, 129, 0.14);
  --warning: #f59e0b;
  --warning-soft: rgba(245, 158, 11, 0.14);
  --danger: #ef4444;
  --danger-soft: rgba(239, 68, 68, 0.14);
  --info: #38bdf8;
  --info-soft: rgba(56, 189, 248, 0.14);
  --shadow-card: 0 4px 20px -2px rgba(0, 0, 0, 0.45);
  --shadow-modal: 0 20px 50px -10px rgba(0, 0, 0, 0.7);
}

[data-theme="light"] {
  --bg-app: #f8fafc;
  --bg-surface: #ffffff;
  --bg-elevated: #f1f5f9;
  --bg-hover: #e2e8f0;
  --bg-input: #ffffff;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;
  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-muted: #64748b;
  --accent: #4f46e5;
  --accent-hover: #4338ca;
  --accent-soft: rgba(79, 70, 229, 0.1);
  --success: #059669;
  --success-soft: rgba(5, 150, 105, 0.12);
  --warning: #d97706;
  --warning-soft: rgba(217, 119, 6, 0.12);
  --danger: #dc2626;
  --danger-soft: rgba(220, 38, 38, 0.12);
  --info: #0284c7;
  --info-soft: rgba(2, 132, 199, 0.12);
  --shadow-card: 0 2px 10px -2px rgba(15, 23, 42, 0.07);
  --shadow-modal: 0 20px 40px -12px rgba(15, 23, 42, 0.22);
}

*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden;
  background-color: var(--bg-app);
  color: var(--text-primary);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

button {
  cursor: pointer;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Persistent Storage Failure Banner */
.storage-error-banner {
  background: #dc2626;
  color: #ffffff;
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  border-bottom: 1px solid rgba(255, 255, 255, 0.22);
  z-index: 55;
}

/* App Shell Layout */
.app-shell {
  display: flex;
  min-height: 100vh;
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden;
}

.sidebar {
  width: 248px;
  background: var(--bg-surface);
  border-right: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: width 0.2s ease, transform 0.2s ease;
  z-index: 40;
}

.sidebar.collapsed {
  width: 72px;
}

.sidebar.collapsed .nav-label,
.sidebar.collapsed .brand-text,
.sidebar.collapsed .sidebar-footer-text {
  display: none;
}

.sidebar.collapsed .nav-item {
  justify-content: center;
  padding-left: 0;
  padding-right: 0;
}

.main-wrapper {
  flex: 1;
  min-width: 0;
  max-width: 100%;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  background: var(--bg-app);
}

.top-header {
  min-height: 64px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 20px;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 30;
  max-width: 100%;
}

.main-content {
  flex: 1;
  padding: 24px;
  max-width: 1440px;
  width: 100%;
  margin: 0 auto;
  min-width: 0;
}

/* Navigation Items */
.nav-list {
  list-style: none;
  margin: 0;
  padding: 12px 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
  overflow-y: auto;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-secondary);
  font-weight: 500;
  text-align: left;
  transition: background 0.15s ease, color 0.15s ease;
}

.nav-item:hover {
  background: var(--bg-elevated);
  color: var(--text-primary);
}

.nav-item.active {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: rgba(99, 102, 241, 0.28);
  font-weight: 600;
}

/* Cards & Surfaces */
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  padding: 18px;
  box-shadow: var(--shadow-card);
  min-width: 0;
  max-width: 100%;
  overflow-wrap: break-word;
}

.card-elevated {
  background: var(--bg-elevated);
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  padding: 14px;
  min-width: 0;
  max-width: 100%;
  overflow-wrap: break-word;
}

.card-interactive {
  transition: transform 0.15s ease, border-color 0.15s ease;
  cursor: pointer;
}

.card-interactive:hover {
  border-color: var(--accent);
  transform: translateY(-1px);
}

/* Grid Helpers */
.grid-kpi {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
}

.grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}

.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

/* Dedicated Split Layouts for Notes & Local Study Tools */
.workspace-split-notes {
  display: grid;
  grid-template-columns: 320px minmax(0, 1fr);
  gap: 18px;
  align-items: start;
}

.workspace-split-assistant {
  display: grid;
  grid-template-columns: 380px minmax(0, 1fr);
  gap: 18px;
  align-items: start;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 8px 14px;
  border-radius: 8px;
  font-weight: 500;
  border: 1px solid transparent;
  transition: background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
  white-space: nowrap;
  max-width: 100%;
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--accent);
  color: #ffffff;
}

.btn-primary:hover:not(:disabled) {
  background: var(--accent-hover);
}

.btn-secondary {
  background: var(--bg-elevated);
  color: var(--text-primary);
  border-color: var(--border-strong);
}

.btn-secondary:hover:not(:disabled) {
  background: var(--bg-hover);
}

.btn-ghost {
  background: transparent;
  color: var(--text-secondary);
}

.btn-ghost:hover:not(:disabled) {
  background: var(--bg-elevated);
  color: var(--text-primary);
}

.btn-danger {
  background: var(--danger-soft);
  color: var(--danger);
  border-color: rgba(239, 68, 68, 0.3);
}

.btn-danger:hover:not(:disabled) {
  background: var(--danger);
  color: #ffffff;
}

.btn-success {
  background: var(--success);
  color: #ffffff;
}

.btn-sm {
  padding: 5px 10px;
  font-size: 12px;
  border-radius: 6px;
}

.btn-lg {
  padding: 11px 20px;
  font-size: 15px;
  font-weight: 600;
  border-radius: 10px;
}

/* Inputs & Forms */
.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 14px;
  min-width: 0;
}

.form-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  letter-spacing: 0.02em;
}

.input, .select, .textarea {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  padding: 9px 12px;
  border-radius: 8px;
  border: 1px solid var(--border-strong);
  background: var(--bg-input);
  color: var(--text-primary);
  transition: border-color 0.15s ease;
}

.input:focus, .select:focus, .textarea:focus {
  border-color: var(--accent);
  outline: none;
}

.textarea {
  resize: vertical;
  min-height: 90px;
}

/* Badges */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.02em;
  max-width: 100%;
}

.badge-accent { background: var(--accent-soft); color: var(--accent); }
.badge-success { background: var(--success-soft); color: var(--success); }
.badge-warning { background: var(--warning-soft); color: var(--warning); }
.badge-danger { background: var(--danger-soft); color: var(--danger); }
.badge-info { background: var(--info-soft); color: var(--info); }
.badge-neutral { background: var(--bg-elevated); color: var(--text-secondary); border: 1px solid var(--border-subtle); }

/* Progress Bar */
.progress-track {
  width: 100%;
  height: 8px;
  background: var(--bg-elevated);
  border-radius: 999px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 999px;
  transition: width 0.25s ease;
}

/* Modals & Dialogs */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(9, 13, 22, 0.72);
  backdrop-filter: blur(3px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 100;
}

.modal-panel {
  background: var(--bg-surface);
  border: 1px solid var(--border-strong);
  border-radius: 14px;
  width: 100%;
  max-width: 560px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-modal);
  padding: 22px;
}

.modal-panel.modal-lg {
  max-width: 760px;
}

/* Toast Notifications */
.toast-container {
  position: fixed;
  bottom: 20px;
  right: 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 120;
  max-width: calc(100vw - 40px);
  width: 340px;
  pointer-events: none;
}

.toast {
  background: var(--bg-surface);
  border: 1px solid var(--border-strong);
  border-left: 4px solid var(--accent);
  padding: 12px 16px;
  border-radius: 10px;
  box-shadow: var(--shadow-modal);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: 13px;
  pointer-events: auto;
}

.toast-success { border-left-color: var(--success); }
.toast-danger { border-left-color: var(--danger); }
.toast-warning { border-left-color: var(--warning); }

/* Flashcard Flip Card */
.flashcard-box {
  min-height: 260px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 28px;
  border-radius: 14px;
  background: var(--bg-elevated);
  border: 2px solid var(--border-strong);
  cursor: pointer;
  user-select: none;
  transition: border-color 0.2s ease, transform 0.15s ease;
}

.flashcard-box:hover {
  border-color: var(--accent);
}

/* Tabs */
.tabs-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  background: var(--bg-surface);
  padding: 5px;
  border-radius: 10px;
  border: 1px solid var(--border-subtle);
  max-width: 100%;
}

.tab-btn {
  padding: 7px 12px;
  border-radius: 7px;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  font-weight: 500;
  font-size: 13px;
}

.tab-btn.active {
  background: var(--accent);
  color: #ffffff;
  font-weight: 600;
}

/* Windows 11 Desktop Toolbar (Hidden on mobile/tablet & inside Edge --app / standalone PWA) */
.win-titlebar {
  min-height: 36px;
  background: #050811;
  color: #cbd5e1;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 0 0 12px;
  font-size: 12px;
  user-select: none;
  position: sticky;
  top: 0;
  z-index: 60;
  max-width: 100%;
  overflow: hidden;
}

[data-theme="light"] .win-titlebar {
  background: #e2e8f0;
  color: #1e293b;
}

.win-titlebar-left {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  min-width: 0;
}

.win-menu-btn {
  background: transparent;
  border: none;
  color: inherit;
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.win-menu-btn:hover {
  background: rgba(255, 255, 255, 0.08);
}

[data-theme="light"] .win-menu-btn:hover {
  background: rgba(15, 23, 42, 0.08);
}

.win-window-controls {
  display: flex;
  align-items: stretch;
  height: 100%;
  flex-shrink: 0;
}

.win-ctrl-btn {
  width: 40px;
  height: 36px;
  border: none;
  background: transparent;
  color: inherit;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  transition: background 0.12s ease, color 0.12s ease;
}

.win-ctrl-btn:hover {
  background: rgba(255, 255, 255, 0.1);
}

.win-ctrl-btn.win-close:hover {
  background: #e81123;
  color: #ffffff;
}

body.compact-widget-mode .sidebar,
body.compact-widget-mode .top-header,
body.compact-widget-mode .mobile-bottom-nav {
  display: none !important;
}

body.compact-widget-mode .main-content {
  max-width: 520px;
  padding: 16px;
}

/* Hide fake titlebar inside installed PWA / Edge --app mode */
@media (display-mode: standalone), (display-mode: window-controls-overlay), (display-mode: minimal-ui) {
  .win-titlebar {
    display: none !important;
  }
}

body.standalone-app-mode .win-titlebar {
  display: none !important;
}

/* Mobile Bottom Nav & Responsive Breakpoints */
.mobile-bottom-nav {
  display: none;
}

.mobile-menu-btn {
  display: none;
}

.sidebar-overlay {
  display: none;
}

@media (max-width: 1023px) {
  .win-titlebar {
    display: none !important;
  }
  .workspace-split-notes,
  .workspace-split-assistant {
    grid-template-columns: minmax(0, 1fr);
  }
  .grid-kpi {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .grid-3 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .sidebar {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    transform: translateX(-100%);
    width: 260px !important;
  }
  .sidebar.mobile-open {
    transform: translateX(0);
  }
  .sidebar-overlay.active {
    display: block;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: 35;
  }
  .mobile-menu-btn {
    display: inline-flex;
  }
  .desktop-collapse-btn {
    display: none !important;
  }
  .main-content {
    padding: 14px;
    padding-bottom: 84px;
  }
  .mobile-bottom-nav {
    display: flex;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 62px;
    background: var(--bg-surface);
    border-top: 1px solid var(--border-subtle);
    z-index: 32;
    justify-content: space-around;
    align-items: center;
    padding: 0 4px;
  }
  .mobile-nav-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-size: 10px;
    font-weight: 500;
    padding: 6px 8px;
    border-radius: 8px;
  }
  .mobile-nav-btn.active {
    color: var(--accent);
    font-weight: 600;
  }
}

@media (max-width: 640px) {
  .grid-kpi,
  .grid-2,
  .grid-3 {
    grid-template-columns: minmax(0, 1fr);
  }
  .top-header {
    padding: 8px 10px;
    gap: 6px;
  }
  .card {
    padding: 14px;
  }
  .card-elevated {
    padding: 11px;
  }
  .hide-on-mobile {
    display: none !important;
  }
  .btn-lg {
    padding: 9px 14px;
    font-size: 14px;
  }
}

  </style>
</head>
<body>
  <!-- Persistent Red Banner when localStorage is blocked and no disk file is actively saving -->
  <div id="storage-error-banner" class="storage-error-banner" role="alert" style="display:none;">
    <span>Your data is NOT being saved on this device. Export a backup.</span>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button type="button" class="btn btn-secondary btn-sm" data-action="export-json-data">Export a backup</button>
      <button type="button" class="btn btn-secondary btn-sm" data-action="win-connect-disk-file">Link Disk File (Ctrl+S)</button>
    </div>
  </div>

  <!-- One-Click IndexedDB File Handle Reconnect Banner -->
  <div id="disk-reconnect-banner" class="card-elevated" style="display:none;border-radius:0;border-left:none;border-right:none;border-top:none;padding:8px 16px;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--bg-elevated);z-index:54;">
    <span style="font-size:12px;">Linked workspace file remembered: <strong id="disk-reconnect-filename">StudyOS-Workspace.json</strong></span>
    <div style="display:flex;gap:8px;">
      <button type="button" class="btn btn-primary btn-sm" data-action="reconnect-disk-file">Reconnect &amp; Sync (1-Click)</button>
      <button type="button" class="btn btn-ghost btn-sm" data-action="export-json-data">Export Backup</button>
    </div>
  </div>

  <!-- Desktop Toolbar (Hidden on screens < 1024px and inside Edge --app / standalone PWA mode) -->
  <div id="win-desktop-titlebar" class="win-titlebar" role="region" aria-label="Desktop File &amp; Window Toolbar">
    <div class="win-titlebar-left">
      <div style="display:inline-flex;align-items:center;gap:7px;font-weight:700;color:var(--text-primary);">
        <span style="width:18px;height:18px;border-radius:4px;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;">S</span>
        <span>StudyOS</span>
      </div>
      <button type="button" class="win-menu-btn" data-action="win-connect-disk-file" title="Save / Link Workspace JSON on Disk (Ctrl+S)">Save File (Ctrl+S)</button>
      <button type="button" class="win-menu-btn" data-action="win-open-disk-file" title="Open Workspace JSON from Disk (Ctrl+O)">Open File (Ctrl+O)</button>
      <button type="button" class="win-menu-btn" data-action="export-json-data" title="Export JSON Backup">Export JSON</button>
      <button type="button" class="win-menu-btn" data-action="toggle-compact-widget" title="Switch to Compact Desktop Timer Widget">Mini Timer Widget</button>
      <button type="button" class="win-menu-btn" style="color:var(--info);font-weight:600;" data-action="open-windows-app-modal">Windows 11 PWA Install</button>
      <span id="win-disk-status-label" style="font-size:11px;color:var(--text-muted);margin-left:4px;">Local Storage Ready</span>
    </div>
    <div class="win-window-controls">
      <button type="button" class="win-ctrl-btn" data-action="toggle-compact-widget" aria-label="Minimize to Compact Timer" title="Compact Timer Mode">&#8211;</button>
      <button type="button" class="win-ctrl-btn" data-action="toggle-fullscreen-window" aria-label="Toggle Fullscreen Window" title="Fullscreen (F11)">&#9633;</button>
      <button type="button" class="win-ctrl-btn win-close" data-action="open-windows-app-modal" aria-label="Windows 11 App Options" title="Windows 11 App Options">&#8943;</button>
    </div>
  </div>

  <div class="app-shell">
    <!-- Mobile Sidebar Backdrop -->
    <div id="sidebar-mobile-overlay" class="sidebar-overlay" data-action="toggle-mobile-sidebar"></div>

    <!-- Collapsible Sidebar Navigation -->
    <aside id="app-sidebar" class="sidebar" aria-label="Primary Sidebar Navigation">
      <div style="height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--border-subtle);">
        <div style="display:flex;align-items:center;gap:10px;">

// =============================================================================

const STORAGE_KEY = 'studyos_state_v1';
const TIMER_STATE_KEY = 'studyos_active_timer_v1';

function generateId(prefix = 'id') {
  return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
}

function isValidTimeZone(tz) {
  if (!tz || typeof tz !== 'string') return false;
  try {
    Intl.DateTimeFormat(undefined, { timeZone: tz.trim() });
    return true;
  } catch (e) {
    return false;
  }
}

function getWallClockInTimeZone(dateObj = new Date(), timeZone = null) {
  const validTz = isValidTimeZone(timeZone)
    ? timeZone.trim()
    : (Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC');
  try {
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: validTz,
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: false
    }).formatToParts(dateObj);
    const getVal = type => parts.find(p => p.type === type)?.value;
    const year = Number(getVal('year'));
    const month = Number(getVal('month'));
    const day = Number(getVal('day'));
    let hour = Number(getVal('hour'));
    if (hour === 24) hour = 0;
    const minute = Number(getVal('minute'));
    const second = Number(getVal('second'));
    const dateStr = `${String(year).padStart(4, '0')}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    return { year, month, day, hour, minute, second, dateStr, timeZone: validTz };
  } catch (e) {
    const yr = dateObj.getFullYear();
    const mo = dateObj.getMonth() + 1;
    const da = dateObj.getDate();
    const hr = dateObj.getHours();
    const mn = dateObj.getMinutes();
    const sc = dateObj.getSeconds();
    const dateStr = `${String(yr).padStart(4, '0')}-${String(mo).padStart(2, '0')}-${String(da).padStart(2, '0')}`;
    return { year: yr, month: mo, day: da, hour: hr, minute: mn, second: sc, dateStr, timeZone: 'UTC' };
  }
}

function getLocalDateString(dateObj = new Date(), timeZone = null) {
  return getWallClockInTimeZone(dateObj, timeZone).dateStr;
}

function addDaysToDateString(dateStr, daysToAdd) {
  const parts = (dateStr || getLocalDateString()).split('-').map(Number);
  const dt = new Date(Date.UTC(parts[0], (parts[1] || 1) - 1, parts[2] || 1, 12, 0, 0));
  dt.setUTCDate(dt.getUTCDate() + Number(daysToAdd || 0));
  return dt.toISOString().slice(0, 10);
}

function createDefaultPreferences() {
  let detectedTz = 'UTC';
  try {
    detectedTz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
  } catch (e) {
    detectedTz = 'UTC';
  }
  return {
    theme: 'dark',
    dailyStudyGoalMinutes: 120,
    weeklyStudyGoalMinutes: 600,
    focusDurationMinutes: 25,
    shortBreakMinutes: 5,
    longBreakMinutes: 15,
    defaultSessionMinutes: 45,
    availableDailyHours: 4,
    studyWindowStart: '09:00',
    studyWindowEnd: '20:00',
    weekStartsOn: 'monday',
    timezone: detectedTz,
    autoTransitionTimer: false,
    soundNotifications: true
  };
}

function createEmptyState() {
  return {
    version: 1,
    profile: {
      id: 'user_local_default',
      displayName: '',
      academicProgram: '',
      email: '',
      isAuthenticated: false,
      storageMode: 'local_persisted'

    preferences: createDefaultPreferences(),
    subjects: [],
    chapters: [],
    tasks: [],
    scheduledSessions: [],
    focusSessions: [],
    flashcardDecks: [],
    flashcards: [],
    flashcardReviews: [],
    notes: [],
    exams: [],
    aiHistory: [],
    onboardingDismissed: false
  };
}

function validateAndNormalizeState(raw) {
  const base = createEmptyState();
  if (!raw || typeof raw !== 'object') return base;
  const mergedPrefs = { ...base.preferences, ...(raw.preferences || {}) };
  if (!isValidTimeZone(mergedPrefs.timezone)) {
    mergedPrefs.timezone = base.preferences.timezone;
  }
  return {
    version: 1,
    profile: { ...base.profile, ...(raw.profile || {}) },
    preferences: mergedPrefs,
    subjects: Array.isArray(raw.subjects) ? raw.subjects : [],
    chapters: Array.isArray(raw.chapters) ? raw.chapters : [],
    tasks: Array.isArray(raw.tasks) ? raw.tasks : [],
    scheduledSessions: Array.isArray(raw.scheduledSessions) ? raw.scheduledSessions : [],
    focusSessions: Array.isArray(raw.focusSessions) ? raw.focusSessions : [],
    flashcardDecks: Array.isArray(raw.flashcardDecks) ? raw.flashcardDecks : [],
    flashcards: Array.isArray(raw.flashcards) ? raw.flashcards : [],
    flashcardReviews: Array.isArray(raw.flashcardReviews) ? raw.flashcardReviews : [],
    notes: Array.isArray(raw.notes) ? raw.notes : [],
    exams: Array.isArray(raw.exams) ? raw.exams : [],
    aiHistory: Array.isArray(raw.aiHistory) ? raw.aiHistory : [],
    onboardingDismissed: Boolean(raw.onboardingDismissed)
  };
}

function hasAnyRealUserData(state) {
  if (!state || typeof state !== 'object') return false;
  return Boolean(
    (state.subjects && state.subjects.length > 0) ||
    (state.tasks && state.tasks.length > 0) ||
    (state.scheduledSessions && state.scheduledSessions.length > 0) ||
    (state.focusSessions && state.focusSessions.length > 0) ||
    (state.flashcardDecks && state.flashcardDecks.length > 0) ||
    (state.flashcards && state.flashcards.length > 0) ||
    (state.notes && state.notes.length > 0) ||
    (state.exams && state.exams.length > 0) ||
    (state.profile && state.profile.displayName && state.profile.displayName.trim().length > 0)
  );
}

      this.storageAvailable = true;
      return true;
    } catch (err) {
      this.storageAvailable = false;
      return false;
    }

    try {
      const serialized = window.localStorage.getItem(STORAGE_KEY);
      this.storageAvailable = true;

function timeStrToMinutes(timeStr) {
  if (!timeStr || typeof timeStr !== 'string' || !timeStr.includes(':')) return 9 * 60;
  const [h, m] = timeStr.split(':').map(Number);
  return (isNaN(h) ? 9 : h) * 60 + (isNaN(m) ? 0 : m);
}

function minutesToTimeStr(totalMinutes) {
  const clamped = Math.max(0, Math.min(23 * 60 + 59, Math.round(totalMinutes)));
  const h = Math.floor(clamped / 60);
  const m = clamped % 60;
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}

/**
 * Detects overlapping scheduled sessions on the same date.
 */
function detectScheduleConflicts(sessions) {
  const conflicts = [];
  const conflictingIds = new Set();
  const byDate = {};

  (sessions || []).forEach(s => {
    if (!s || !s.sessionDate || s.status === 'missed') return;
    if (!byDate[s.sessionDate]) byDate[s.sessionDate] = [];
    byDate[s.sessionDate].push(s);
  });

  Object.keys(byDate).forEach(dateStr => {
    const list = byDate[dateStr].slice().sort((a, b) => timeStrToMinutes(a.startTime) - timeStrToMinutes(b.startTime));
    for (let i = 0; i < list.length; i++) {
      const a = list[i];
      const startA = timeStrToMinutes(a.startTime);
      const endA = startA + Number(a.durationMinutes || 45);
      for (let j = i + 1; j < list.length; j++) {
        const b = list[j];
        const startB = timeStrToMinutes(b.startTime);
        const endB = startB + Number(b.durationMinutes || 45);
        if (startA < endB && startB < endA) {
          conflictingIds.add(a.id);
          conflictingIds.add(b.id);
          conflicts.push({
            date: dateStr,
            sessionA: a,
            sessionB: b,
            message: `"${a.title}" (${a.startTime}, ${a.durationMinutes}m) overlaps with "${b.title}" (${b.startTime}, ${b.durationMinutes}m) on ${dateStr}.`
          });
        }
      }
    }
  });

  return { conflicts, conflictingIds };
}

/**
 * Generates a realistic proposed revision schedule from real unscheduled/incomplete tasks.
 * Never overwrites existing scheduled sessions and never schedules in the past on today's date.
 */
function generateSmartSchedule(state, customOptions = {}) {
  const prefs = state.preferences || {};
  const nowClock = getWallClockInTimeZone(new Date(), prefs.timezone);
  const todayStr = nowClock.dateStr;
  const nowMinutesOfDay = nowClock.hour * 60 + nowClock.minute;
  // Round current time up to the next 15-minute boundary (if exact 15m boundary and seconds > 0, round up)
  const rawMinutesWithSec = nowMinutesOfDay + (nowClock.second > 0 ? 1 : 0);
  const nowRoundedUp15Min = Math.ceil(rawMinutesWithSec / 15) * 15;

  const horizonDays = Number(customOptions.horizonDays || 7);
  const maxDailyMinutes = Math.round(Number(customOptions.availableDailyHours || prefs.availableDailyHours || 4) * 60);
  const windowStartMin = timeStrToMinutes(customOptions.studyWindowStart || prefs.studyWindowStart || '09:00');
  const windowEndMin = timeStrToMinutes(customOptions.studyWindowEnd || prefs.studyWindowEnd || '20:00');
  const preferredSessionMin = Math.max(15, Number(customOptions.defaultSessionMinutes || prefs.defaultSessionMinutes || 45));
  const bufferMinutes = 15;

  const existingSessions = (state.scheduledSessions || []).slice();
  const scheduledTaskIds = new Set(existingSessions.map(s => s.taskId).filter(Boolean));

  // Map subjects for importance weighting (upcoming exams boost priority)
  const subjectImportance = {};
  (state.subjects || []).forEach(sub => {
    let weight = 1.0;
    if (sub.examDate && sub.examDate >= todayStr) {
      weight += 0.5;
    }
    subjectImportance[sub.id] = weight;
  });

  (state.exams || []).forEach(ex => {
    if (ex.subjectId && ex.examDate >= todayStr && ex.status !== 'completed' && ex.status !== 'archived') {
      subjectImportance[ex.subjectId] = (subjectImportance[ex.subjectId] || 1.0) + 0.6;
    }
  });

  // Candidate tasks: incomplete and not already scheduled in an active future session
  const candidateTasks = (state.tasks || []).filter(t => !t.completed && !scheduledTaskIds.has(t.id));

  // Score and sort tasks by deadline urgency, priority, and subject importance
  const priorityScore = { high: 300, medium: 200, low: 100 };
  const sortedTasks = candidateTasks.slice().sort((a, b) => {
    const dueA = a.dueDate || '9999-12-31';
    const dueB = b.dueDate || '9999-12-31';
    if (dueA !== dueB) return dueA.localeCompare(dueB);
    const scoreA = (priorityScore[a.priority] || 200) * (subjectImportance[a.subjectId] || 1.0);
    const scoreB = (priorityScore[b.priority] || 200) * (subjectImportance[b.subjectId] || 1.0);
    return scoreB - scoreA;
  });

  const proposedSessions = [];
  const warnings = [];

  // Track occupied intervals per date
  const occupiedByDate = {};
  const minutesUsedByDate = {};

  for (let d = 0; d < horizonDays; d++) {
    const dateStr = addDaysToDateString(todayStr, d);
    occupiedByDate[dateStr] = [];
    minutesUsedByDate[dateStr] = 0;
  }

  existingSessions.forEach(s => {
    if (occupiedByDate[s.sessionDate]) {
      const st = timeStrToMinutes(s.startTime);
      const dur = Number(s.durationMinutes || 45);
      occupiedByDate[s.sessionDate].push([st, st + dur]);
      minutesUsedByDate[s.sessionDate] += dur;
    }
  });

  function findNextSlotOnDate(dateStr, durationMin) {
    if ((minutesUsedByDate[dateStr] || 0) + durationMin > maxDailyMinutes) {
      return null;
    }
    const intervals = (occupiedByDate[dateStr] || []).slice().sort((a, b) => a[0] - b[0]);
    // For today, never schedule in the past: start at max(windowStartMin, nowRoundedUp15Min)
    let candidateStart = dateStr === todayStr
      ? Math.max(windowStartMin, nowRoundedUp15Min)
      : windowStartMin;

    for (const [occStart, occEnd] of intervals) {
      if (candidateStart + durationMin <= occStart) {
        return candidateStart;
      }
      if (candidateStart < occEnd + bufferMinutes) {
        candidateStart = occEnd + bufferMinutes;
      }
    }

    if (candidateStart + durationMin <= windowEndMin) {
      return candidateStart;
    }
    return null;
  }

  sortedTasks.forEach(task => {
    let remainingMin = Math.max(15, Number(task.estimatedMinutes || preferredSessionMin));
    let chunkIndex = 1;
    const totalChunks = Math.ceil(remainingMin / preferredSessionMin);

    for (let d = 0; d < horizonDays && remainingMin > 0; d++) {
      const dateStr = addDaysToDateString(todayStr, d);
      while (remainingMin > 0) {
        const chunkDuration = Math.min(remainingMin, Math.max(preferredSessionMin, 30));
        const slotStart = findNextSlotOnDate(dateStr, chunkDuration);
        if (slotStart === null) break;

        occupiedByDate[dateStr].push([slotStart, slotStart + chunkDuration]);
        minutesUsedByDate[dateStr] += chunkDuration;
        remainingMin -= chunkDuration;

        const sessionTitle = totalChunks > 1
          ? `${task.title} (Part ${chunkIndex}/${totalChunks})`
          : task.title;

        proposedSessions.push({
          id: generateId('sched'),
          taskId: task.id,
          subjectId: task.subjectId || null,
          title: sessionTitle,
          sessionDate: dateStr,
          startTime: minutesToTimeStr(slotStart),
          durationMinutes: chunkDuration,
          status: 'scheduled',
          notes: task.dueDate && dateStr > task.dueDate
            ? `Scheduled after due date (${task.dueDate}) due to limited earlier availability.`
            : `Auto-scheduled (${task.priority.toUpperCase()} priority)`
        });

        if (task.dueDate && dateStr > task.dueDate) {
          warnings.push(`Task "${task.title}" is due on ${task.dueDate}, but earliest available slot was ${dateStr}.`);
        }
        chunkIndex++;
      }
    }

    if (remainingMin > 0) {
      warnings.push(
        `Insufficient study time in the ${horizonDays}-day window to schedule ${remainingMin}m for "${task.title}" (due ${task.dueDate || 'unscheduled'}). Increase daily available hours or extend study window.`
      );
    }
  });

  return {
    proposedSessions,
    warnings,
    candidateCount: sortedTasks.length
  };
}

/**
 * Spaced-Repetition Scheduler (SM-2 adapted for Hard / Medium / Easy ratings).
 */
function calculateSpacedRepetition(card, rating, todayStr) {
  let reps = Number(card.repetitions || 0);
  let interval = Number(card.intervalDays || 0);
  let ease = Number(card.easeFactor || 2.5);

  if (rating === 'hard') {
    reps = 0;
    interval = 1;
    ease = Math.max(1.3, Number((ease - 0.2).toFixed(2)));
  } else if (rating === 'medium') {
    reps += 1;
    if (reps === 1) interval = 2;
    else if (reps === 2) interval = 4;
    else interval = Math.max(2, Math.round(interval * ease * 0.85));
    ease = Math.max(1.3, Number((ease - 0.05).toFixed(2)));
  } else {
    // easy
    reps += 1;
    if (reps === 1) interval = 4;
    else if (reps === 2) interval = 7;
    else interval = Math.max(4, Math.round(interval * ease));
    ease = Math.min(3.0, Number((ease + 0.15).toFixed(2)));
  }

  const nextReviewDate = addDaysToDateString(todayStr, interval);
  return {
    difficulty: rating,
    repetitions: reps,
    intervalDays: interval,
    easeFactor: ease,
    nextReviewDate,
    lastReviewedAt: new Date().toISOString()
  };
}

function computeAnalytics(state) {
  const prefs = state.preferences || {};
  const tz = prefs.timezone || 'UTC';
  const todayStr = getLocalDateString(new Date(), tz);

  // Only completed 'focus' mode sessions count as actual study time (never breaks or interrupted sessions)
  const completedFocusSessions = (state.focusSessions || []).filter(
    s => s && s.mode === 'focus' && s.status === 'completed' && Number(s.durationMinutes) > 0
  );

  // Map study minutes by YYYY-MM-DD date
  const minutesByDate = {};
  const minutesBySubject = {};
  let totalAllTimeMinutes = 0;

  completedFocusSessions.forEach(s => {
    const dStr = s.startTime ? getLocalDateString(new Date(s.startTime), tz) : todayStr;
    const mins = Number(s.durationMinutes || 0);
    minutesByDate[dStr] = (minutesByDate[dStr] || 0) + mins;
    if (s.subjectId) {
      minutesBySubject[s.subjectId] = (minutesBySubject[s.subjectId] || 0) + mins;
    }
    totalAllTimeMinutes += mins;
  });

  const studyMinutesToday = Math.round(minutesByDate[todayStr] || 0);

  // Last 7 days series (oldest to today)
  const last7DaysSeries = [];
  let studyMinutesLast7Days = 0;
  let plannedMinutesLast7Days = 0;

  const scheduledByDate = {};
  (state.scheduledSessions || []).forEach(ss => {
    if (ss && ss.sessionDate) {
      scheduledByDate[ss.sessionDate] = (scheduledByDate[ss.sessionDate] || 0) + Number(ss.durationMinutes || 0);
    }
  });

  for (let i = 6; i >= 0; i--) {
    const dStr = addDaysToDateString(todayStr, -i);
    const actual = Math.round(minutesByDate[dStr] || 0);
    const planned = Math.round(scheduledByDate[dStr] || 0);
    studyMinutesLast7Days += actual;
    plannedMinutesLast7Days += planned;
    const label = dStr.slice(5); // MM-DD
    last7DaysSeries.push({ date: dStr, label, actualMinutes: actual, plannedMinutes: planned });
  }

  // Last 4 weeks series
  const last4WeeksSeries = [];
  for (let w = 3; w >= 0; w--) {
    let weekActual = 0;
    let weekPlanned = 0;
    const endOffset = -(w * 7);
    const startOffset = endOffset - 6;
    const startLabel = addDaysToDateString(todayStr, startOffset).slice(5);
    const endLabel = addDaysToDateString(todayStr, endOffset).slice(5);
    for (let d = startOffset; d <= endOffset; d++) {
      const dStr = addDaysToDateString(todayStr, d);
      weekActual += Math.round(minutesByDate[dStr] || 0);
      weekPlanned += Math.round(scheduledByDate[dStr] || 0);
    }
    last4WeeksSeries.push({
      label: `${startLabel} – ${endLabel}`,
      actualMinutes: weekActual,
      plannedMinutes: weekPlanned
    });
  }

  // Study streak calculation (active days with completed focus session OR completed task)
  const activeDates = new Set(Object.keys(minutesByDate).filter(d => minutesByDate[d] > 0));
  (state.tasks || []).forEach(t => {
    if (t.completed && t.completedAt) {
      activeDates.add(getLocalDateString(new Date(t.completedAt), tz));
    }
  });

  let currentStreak = 0;
  let cursorDate = todayStr;
  if (!activeDates.has(cursorDate)) {
    const yesterdayStr = addDaysToDateString(todayStr, -1);
    if (activeDates.has(yesterdayStr)) {
      cursorDate = yesterdayStr;
    } else {
      cursorDate = null;
    }
  }
  while (cursorDate && activeDates.has(cursorDate)) {
    currentStreak += 1;
    cursorDate = addDaysToDateString(cursorDate, -1);
  }

  // Tasks statistics
  const allTasks = state.tasks || [];
  const completedTasks = allTasks.filter(t => t.completed);
  const remainingTasks = allTasks.filter(t => !t.completed);
  const tasksDueToday = remainingTasks.filter(t => t.dueDate === todayStr);
  const overdueTasks = remainingTasks.filter(t => t.dueDate && t.dueDate < todayStr);
  const unscheduledTasks = remainingTasks.filter(t => !t.scheduledDate);
  const taskCompletionRate = allTasks.length > 0
    ? Math.round((completedTasks.length / allTasks.length) * 100)
    : 0;

  // Subject breakdown
  const activeSubjects = (state.subjects || []).filter(s => !s.archived);
  const subjectBreakdown = activeSubjects.map(sub => {
    const subChapters = (state.chapters || []).filter(c => c.subjectId === sub.id);
    const completedChapters = subChapters.filter(c => c.status === 'completed').length;
    const inProgressChapters = subChapters.filter(c => c.status === 'in_progress').length;
    const subTasks = allTasks.filter(t => t.subjectId === sub.id);
    const subTasksDone = subTasks.filter(t => t.completed).length;

    let progressPct = 0;
    const totalUnits = subChapters.length + subTasks.length;
    if (totalUnits > 0) {
      const earnedUnits = completedChapters + (inProgressChapters * 0.4) + subTasksDone;
      progressPct = Math.min(100, Math.round((earnedUnits / totalUnits) * 100));
    }

    return {
      subject: sub,
      studyMinutes: Math.round(minutesBySubject[sub.id] || 0),
      totalChapters: subChapters.length,
      completedChapters,
      inProgressChapters,
      totalTasks: subTasks.length,
      completedTasks: subTasksDone,
      progressPct
    };
  });

  // Flashcards statistics
  const allCards = state.flashcards || [];
  const dueCards = allCards.filter(c => !c.nextReviewDate || c.nextReviewDate <= todayStr);
  const difficultCards = allCards.filter(c => c.difficulty === 'hard');
  const reviews = state.flashcardReviews || [];
  const correctReviews = reviews.filter(r => r.wasCorrect).length;
  const flashcardAccuracyPct = reviews.length > 0
    ? Math.round((correctReviews / reviews.length) * 100)
    : 0;

  // Daily & Weekly Goals
  const dailyGoal = Math.max(15, Number(prefs.dailyStudyGoalMinutes || 120));
  const weeklyGoal = Math.max(60, Number(prefs.weeklyStudyGoalMinutes || 600));
  const dailyGoalPct = Math.min(100, Math.round((studyMinutesToday / dailyGoal) * 100));
  const weeklyGoalPct = Math.min(100, Math.round((studyMinutesLast7Days / weeklyGoal) * 100));

  // Restrained Achievements evaluation based on real recorded data
  const achievements = [
    {
      key: 'first_task',
      title: 'First Step Forward',
      description: 'Complete your first academic task.',
      unlocked: completedTasks.length >= 1,
      progressLabel: `${Math.min(1, completedTasks.length)} / 1 task`
    },
    {
      key: 'first_focus',
      title: 'Deep Focus Initiated',
      description: 'Complete your first uninterrupted focus session.',
      unlocked: completedFocusSessions.length >= 1,
      progressLabel: `${Math.min(1, completedFocusSessions.length)} / 1 session`
    },
    {
      key: 'first_study_day',
      title: 'First Study Day Logged',
      description: 'Record at least 25 minutes of completed focus time in a single day.',
      unlocked: Object.values(minutesByDate).some(m => m >= 25),
      progressLabel: `${Math.min(25, studyMinutesToday)} / 25 min today`
    },
    {
      key: 'daily_goal_reached',
      title: 'Daily Target Reached',
      description: `Meet your daily study goal (${dailyGoal}m) in a single day.`,
      unlocked: Object.values(minutesByDate).some(m => m >= dailyGoal),
      progressLabel: `${studyMinutesToday} / ${dailyGoal} min`
    },
    {
      key: 'weekly_goal_reached',
      title: 'Balanced Week',
      description: `Reach your weekly study goal (${weeklyGoal}m) while pacing your workload.`,
      unlocked: studyMinutesLast7Days >= weeklyGoal,
      progressLabel: `${studyMinutesLast7Days} / ${weeklyGoal} min`
    },
    {
      key: 'first_deck_reviewed',
      title: 'Active Recall Practitioner',
      description: 'Complete at least 5 flashcard spaced-repetition reviews.',
      unlocked: reviews.length >= 5,
      progressLabel: `${Math.min(5, reviews.length)} / 5 reviews`
    },
    {
      key: 'consistent_streak_3',
      title: 'Steady Rhythm (3-Day Streak)',
      description: 'Study consistently across 3 consecutive days. Remember to take regular rest days too!',
      unlocked: currentStreak >= 3,
      progressLabel: `${Math.min(3, currentStreak)} / 3 days`
    }
  ];

  return {
    todayStr,
    studyMinutesToday,
    studyMinutesLast7Days,
    plannedMinutesLast7Days,
    totalAllTimeMinutes: Math.round(totalAllTimeMinutes),
    dailyGoal,
    weeklyGoal,
    dailyGoalPct,

function getIcon(name) {
  return ICONS[name] || ICONS.book;
}

function escapeHtml(value) {
  if (value === null || value === undefined) return '';
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function formatDuration(minutes) {
  const m = Math.round(Number(minutes || 0));
  if (m <= 0) return '0m';
  const hrs = Math.floor(m / 60);
  const rem = m % 60;
  if (hrs === 0) return `${rem}m`;
  if (rem === 0) return `${hrs}h`;
  return `${hrs}h ${rem}m`;
}

function formatTimerClock(totalSeconds) {
  const sec = Math.max(0, Math.floor(Number(totalSeconds || 0)));
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

/**
 * Computes exam countdown strictly from the configured timezone's wall clock,
 * never from the browser's local getHours().
 */
function getExamCountdown(examDate, examTime = '09:00', timeZone = 'UTC') {
  if (!examDate) return { isPast: false, days: 0, hours: 0, label: 'No date set', urgent: false };
  const [y, m, d] = examDate.split('-').map(Number);
  const [hh, mm] = (examTime || '09:00').split(':').map(Number);
  const targetWallMs = Date.UTC(y, (m || 1) - 1, d || 1, isNaN(hh) ? 9 : hh, isNaN(mm) ? 0 : mm, 0);

  const nowWall = getWallClockInTimeZone(new Date(), timeZone);
  const currentWallMs = Date.UTC(
    nowWall.year,
    (nowWall.month || 1) - 1,
    nowWall.day || 1,
    nowWall.hour || 0,
    nowWall.minute || 0,
    0
  );

  const diffMs = targetWallMs - currentWallMs;
  const diffDays = Math.floor(diffMs / 86400000);
  const diffHours = Math.floor((diffMs % 86400000) / 3600000);

  if (diffMs < 0) {
    const pastDays = Math.abs(Math.ceil(diffMs / 86400000));
    return {
      isPast: true,
      days: -pastDays,
      hours: 0,
      label: pastDays === 0 ? 'Earlier today' : `${pastDays}d ago`,
      urgent: false
    };
  }
  if (diffDays === 0) {
    return {
      isPast: false,
      days: 0,
      hours: Math.max(0, diffHours),
      label: diffHours <= 0 ? 'Due right now' : `Today in ${diffHours}h`,
      urgent: true
    };
  }
  return {
    isPast: false,
    days: diffDays,
    hours: Math.max(0, diffHours),
    label: `${diffDays}d ${Math.max(0, diffHours)}h remaining`,
    urgent: diffDays <= 7
  };
}

function renderMarkdownSafe(mdText) {
  if (!mdText) return '<p style="color:var(--text-muted);">No content written yet.</p>';
  const lines = String(mdText).split('\n');
  const htmlOut = [];
  let inList = false;

  lines.forEach(rawLine => {
    const line = escapeHtml(rawLine);
    if (line.startsWith('### ')) {
      if (inList) { htmlOut.push('</ul>'); inList = false; }
      htmlOut.push(`<h4 style="margin:12px 0 6px;font-size:15px;font-weight:700;">${line.slice(4)}</h4>`);
    } else if (line.startsWith('## ')) {
      if (inList) { htmlOut.push('</ul>'); inList = false; }
      htmlOut.push(`<h3 style="margin:14px 0 8px;font-size:17px;font-weight:700;">${line.slice(3)}</h3>`);
    } else if (line.startsWith('# ')) {
      if (inList) { htmlOut.push('</ul>'); inList = false; }
      htmlOut.push(`<h2 style="margin:16px 0 8px;font-size:19px;font-weight:700;color:var(--text-primary);">${line.slice(2)}</h2>`);
    } else if (line.startsWith('- [x] ') || line.startsWith('- [ ] ')) {
      if (!inList) { htmlOut.push('<ul style="margin:8px 0;padding-left:20px;">'); inList = true; }
      const checked = line.startsWith('- [x] ');
      const text = formatInlineMarkdown(line.slice(6));
      htmlOut.push(`<li style="margin:4px 0;list-style:none;"><span style="color:${checked ? 'var(--success)' : 'var(--text-muted)'};font-weight:700;">${checked ? '✓' : '○'}</span> ${text}</li>`);
    } else if (line.startsWith('- ') || line.startsWith('* ')) {
      if (!inList) { htmlOut.push('<ul style="margin:8px 0;padding-left:20px;">'); inList = true; }
      htmlOut.push(`<li style="margin:4px 0;">${formatInlineMarkdown(line.slice(2))}</li>`);
    } else if (line.startsWith('&gt; ')) {
      if (inList) { htmlOut.push('</ul>'); inList = false; }
      htmlOut.push(`<blockquote style="margin:10px 0;padding:8px 12px;border-left:3px solid var(--accent);background:var(--bg-elevated);border-radius:6px;">${formatInlineMarkdown(line.slice(5))}</blockquote>`);
    } else if (line.trim() === '') {
      if (inList) { htmlOut.push('</ul>'); inList = false; }
      htmlOut.push('<div style="height:8px;"></div>');
    } else {
      if (inList) { htmlOut.push('</ul>'); inList = false; }
      htmlOut.push(`<p style="margin:4px 0;">${formatInlineMarkdown(line)}</p>`);
    }
  });
  if (inList) htmlOut.push('</ul>');
  return htmlOut.join('');
}

function formatInlineMarkdown(escapedLine) {
  return escapedLine
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`([^`]+)`/g, '<code style="background:var(--bg-app);padding:2px 6px;border-radius:4px;font-family:monospace;font-size:12px;">$1</code>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer" style="color:var(--accent);text-decoration:underline;">$1</a>');
}

function playCompletionChime(enabled = true) {
  if (!enabled) return;
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.14); // E5
    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.28); // G5
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.65);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.65);
  } catch (e) {
    // Audio blocked before gesture or unsupported
  }
}

/**
 * Renders a responsive SVG bar chart for 7-day study activity with target line.
 */
function renderStudyBarChartSvg(series, targetMinutes = 120) {
  if (!series || series.length === 0) {
    return '<div style="padding:32px;text-align:center;color:var(--text-muted);">No study data recorded yet.</div>';
  }
  const maxVal = Math.max(targetMinutes, ...series.map(d => Math.max(d.actualMinutes || 0, d.plannedMinutes || 0)), 60);
  const chartHeight = 160;
  const chartWidth = 560;
  const padLeft = 38;
  const padRight = 16;
  const padTop = 18;
  const padBottom = 28;
  const plotW = chartWidth - padLeft - padRight;
  const plotH = chartHeight - padTop - padBottom;
  const slotW = plotW / series.length;
  const targetY = padTop + plotH - Math.min(plotH, (targetMinutes / maxVal) * plotH);

  const bars = series.map((item, idx) => {
    const xCenter = padLeft + idx * slotW + slotW / 2;
    const barW = Math.min(26, slotW * 0.42);
    const actualH = Math.max(2, (item.actualMinutes / maxVal) * plotH);
    const actualY = padTop + plotH - actualH;
    const plannedH = Math.max(2, (item.plannedMinutes / maxVal) * plotH);
    const plannedY = padTop + plotH - plannedH;

    return `
      <g>
        <title>${escapeHtml(item.date)}: Actual ${item.actualMinutes}m / Planned ${item.plannedMinutes}m</title>
        <rect x="${(xCenter - barW - 2).toFixed(1)}" y="${plannedY.toFixed(1)}" width="${barW.toFixed(1)}" height="${plannedH.toFixed(1)}" rx="4" fill="var(--border-strong)" opacity="0.65" />
        <rect x="${(xCenter + 2).toFixed(1)}" y="${actualY.toFixed(1)}" width="${barW.toFixed(1)}" height="${actualH.toFixed(1)}" rx="4" fill="var(--accent)" />
        <text x="${xCenter.toFixed(1)}" y="${chartHeight - 8}" text-anchor="middle" fill="var(--text-secondary)" font-size="11">${escapeHtml(item.label)}</text>
        ${item.actualMinutes > 0 ? `<text x="${(xCenter + 2 + barW / 2).toFixed(1)}" y="${Math.max(12, actualY - 4).toFixed(1)}" text-anchor="middle" fill="var(--text-primary)" font-size="10" font-weight="600">${item.actualMinutes}m</text>` : ''}
      </g>
    `;
  }).join('');

  return `
    <div style="width:100%;overflow:hidden;">
      <svg viewBox="0 0 ${chartWidth} ${chartHeight}" style="width:100%;height:auto;display:block;" role="img" aria-label="Weekly Study Time Chart">
        <line x1="${padLeft}" y1="${padTop + plotH}" x2="${chartWidth - padRight}" y2="${padTop + plotH}" stroke="var(--border-strong)" stroke-width="1" />
        <line x1="${padLeft}" y1="${targetY.toFixed(1)}" x2="${chartWidth - padRight}" y2="${targetY.toFixed(1)}" stroke="var(--success)" stroke-width="1.2" stroke-dasharray="4 4" />
        <text x="${padLeft - 6}" y="${(targetY + 3).toFixed(1)}" text-anchor="end" fill="var(--success)" font-size="10">${targetMinutes}m</text>
        <text x="${padLeft - 6}" y="${padTop + plotH}" text-anchor="end" fill="var(--text-muted)" font-size="10">0m</text>
        ${bars}
      </svg>

function getSubjectById(subjectId) {
  if (!subjectId) return null;
  return (App.state.subjects || []).find(s => s.id === subjectId) || null;
}

function getChapterById(chapterId) {
  if (!chapterId) return null;
  return (App.state.chapters || []).find(c => c.id === chapterId) || null;
}

function renderSubjectBadge(subjectId) {
  const sub = getSubjectById(subjectId);
  if (!sub) return '<span class="badge badge-neutral">General</span>';
  return `<span class="badge" style="background:${escapeHtml(sub.color)}22;color:${escapeHtml(sub.color)};border:1px solid ${escapeHtml(sub.color)}55;">${escapeHtml(sub.name)}</span>`;
}

function renderPriorityBadge(priority) {
  const p = (priority || 'medium').toLowerCase();
  if (p === 'high') return '<span class="badge badge-danger">High Priority</span>';
  if (p === 'low') return '<span class="badge badge-info">Low Priority</span>';
  return '<span class="badge badge-warning">Medium Priority</span>';
}

                    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                      ${renderSubjectBadge(fs.subjectId)}
                      <span style="font-weight:600;">${formatDuration(fs.durationMinutes)}</span>
                      <span class="badge ${fs.status === 'completed' ? 'badge-success' : 'badge-warning'}">${escapeHtml(fs.status === 'needs_review' ? 'needs review' : fs.status)}</span>
                    </div>
                    <div style="font-size:11px;color:var(--text-muted);margin-top:3px;">
                      ${escapeHtml(String(fs.startTime || '').slice(0, 16).replace('T', ' '))}
                    </div>
                  </div>
                  <button type="button" class="btn btn-ghost btn-sm" data-action="nav-section" data-section="timer">View Log</button>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      </div>
    </div>
  `;
}

// 2. SUBJECT MANAGEMENT & DEDICATED SUBJECT DETAIL WORKSPACE
// -----------------------------------------------------------------------------
function renderSubjectsView(stats) {
  if (App.ui.selectedSubjectId) {
    const sub = getSubjectById(App.ui.selectedSubjectId);
    if (sub) {
      return renderSubjectDetailView(sub, stats);
    }
    App.ui.selectedSubjectId = null;
  }

  const activeSubjects = (App.state.subjects || []).filter(s => !s.archived);
  const archivedSubjects = (App.state.subjects || []).filter(s => s.archived);

  return `
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;">
        <div>
          <h1 style="margin:0 0 4px;font-size:22px;font-weight:700;">Subjects & Curriculum</h1>
          <p style="margin:0;color:var(--text-secondary);">Organize courses, syllabus chapters, target grades, and subject-specific materials.</p>
        </div>
        <button type="button" class="btn btn-primary" data-action="open-subject-modal">
          ${getIcon('plus')} New Subject
        </button>
      </div>

      ${activeSubjects.length === 0 ? `
        <div class="card" style="text-align:center;padding:40px 20px;">
          <h3 style="margin:0 0 8px;">No active subjects yet</h3>
          <p style="margin:0 0 16px;color:var(--text-secondary);">Create your first subject to start tracking chapters, tasks, notes, and focus hours.</p>
          <button type="button" class="btn btn-primary" data-action="open-subject-modal">${getIcon('plus')} Create Subject</button>
        </div>
      ` : `
        <div class="grid-3" style="margin-bottom:24px;">
          ${activeSubjects.map(sub => {
            const b = stats.subjectBreakdown.find(x => x.subject.id === sub.id) || {
              studyMinutes: 0, totalChapters: 0, completedChapters: 0, totalTasks: 0, completedTasks: 0, progressPct: 0
            };
            const notesCount = (App.state.notes || []).filter(n => n.subjectId === sub.id).length;
            const decksCount = (App.state.flashcardDecks || []).filter(d => d.subjectId === sub.id).length;
            return `
              <div class="card" style="display:flex;flex-direction:column;justify-content:space-between;border-top:3px solid ${escapeHtml(sub.color)};">
                <div>
                  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;">
                    <div style="display:flex;align-items:center;gap:10px;min-width:0;">
                      <span style="width:34px;height:34px;border-radius:8px;background:${escapeHtml(sub.color)}22;color:${escapeHtml(sub.color)};display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;">
                        ${getIcon(sub.icon || 'book')}
                      </span>
                      <div style="min-width:0;">
                        <h3 style="margin:0;font-size:16px;font-weight:700;">${escapeHtml(sub.name)}</h3>
                        <span style="font-size:11px;color:var(--text-secondary);">Target Grade: <strong>${escapeHtml(sub.targetGrade || 'A')}</strong></span>
                      </div>
                    </div>
                    <span class="badge badge-neutral">${b.progressPct}%</span>
                  </div>
                  <p style="margin:0 0 12px;color:var(--text-secondary);font-size:13px;min-height:36px;">
                    ${escapeHtml(sub.description || 'No description provided.')}
                  </p>
                  <div class="progress-track" style="margin-bottom:10px;">
                    <div class="progress-fill" style="width:${b.progressPct}%;background:${escapeHtml(sub.color)};"></div>
                  </div>
                  <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px;font-size:12px;color:var(--text-secondary);margin-bottom:14px;">
                    <div>Chapters: <strong>${b.completedChapters}/${b.totalChapters}</strong></div>
                    <div>Tasks: <strong>${b.completedTasks}/${b.totalTasks}</strong></div>
                    <div>Study Time: <strong>${formatDuration(b.studyMinutes)}</strong></div>
                    <div>Notes / Decks: <strong>${notesCount} / ${decksCount}</strong></div>
                  </div>
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--border-subtle);">
                  <button type="button" class="btn btn-primary btn-sm" data-action="open-subject-detail" data-subject-id="${escapeHtml(sub.id)}">
                    Open Workspace
                  </button>
                  <div style="display:flex;gap:4px;">
                    <button type="button" class="btn btn-ghost btn-sm" data-action="edit-subject" data-subject-id="${escapeHtml(sub.id)}" aria-label="Edit ${escapeHtml(sub.name)}">
                      ${getIcon('edit')}
                    </button>
                    <button type="button" class="btn btn-ghost btn-sm" data-action="archive-subject" data-subject-id="${escapeHtml(sub.id)}" title="Archive Subject">
                      Archive
                    </button>
                    <button type="button" class="btn btn-danger btn-sm" data-action="delete-subject" data-subject-id="${escapeHtml(sub.id)}" aria-label="Delete ${escapeHtml(sub.name)}">
                      ${getIcon('trash')}
                    </button>
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `}

      ${archivedSubjects.length > 0 ? `
        <div class="card">
          <h3 style="margin:0 0 12px;font-size:15px;color:var(--text-secondary);">Archived Subjects (${archivedSubjects.length})</h3>
          <div style="display:flex;flex-direction:column;gap:8px;">
            ${archivedSubjects.map(sub => `
              <div class="card-elevated" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
                <div>
                  <strong>${escapeHtml(sub.name)}</strong>
                  <span style="color:var(--text-muted);font-size:12px;margin-left:8px;">Archived</span>
                </div>
                <div style="display:flex;gap:8px;">
                  <button type="button" class="btn btn-secondary btn-sm" data-action="archive-subject" data-subject-id="${escapeHtml(sub.id)}">Restore</button>
                  <button type="button" class="btn btn-danger btn-sm" data-action="delete-subject" data-subject-id="${escapeHtml(sub.id)}">Delete</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      ` : ''}
    </div>
  `;
}

function renderSubjectDetailView(sub, stats) {

      <div class="card" style="margin-bottom:20px;border-left:4px solid ${escapeHtml(sub.color)};">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;">
          <div>
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;">
              <h1 style="margin:0;font-size:22px;font-weight:700;">${escapeHtml(sub.name)}</h1>
              <span class="badge badge-accent">Target Grade: ${escapeHtml(sub.targetGrade || 'A')}</span>

          </div>

            <button type="button" class="btn btn-primary btn-sm" data-action="start-subject-focus" data-subject-id="${escapeHtml(sub.id)}">
              ${getIcon('timer')} Focus on ${escapeHtml(sub.name)}
            </button>
            <button type="button" class="btn btn-secondary btn-sm" data-action="edit-subject" data-subject-id="${escapeHtml(sub.id)}">
              ${getIcon('edit')} Edit
            </button>
          </div>
        </div>

        <div class="grid-kpi" style="margin-top:16px;">
          <div class="card-elevated">
            <div style="font-size:11px;color:var(--text-secondary);">OVERALL PROGRESS</div>
            <div style="font-size:20px;font-weight:700;margin-top:2px;">${b.progressPct}%</div>
          </div>
          <div class="card-elevated">
            <div style="font-size:11px;color:var(--text-secondary);">RECORDED STUDY TIME</div>
            <div style="font-size:20px;font-weight:700;margin-top:2px;">${formatDuration(b.studyMinutes)}</div>
          </div>

          <div class="card-elevated">
            <div style="font-size:11px;color:var(--text-secondary);">TASKS COMPLETED</div>
            <div style="font-size:20px;font-weight:700;margin-top:2px;">${b.completedTasks} / ${b.totalTasks}</div>

      <div class="grid-2">
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <h3 style="margin:0;font-size:16px;">Chapters & Syllabus Topics (${subChapters.length})</h3>
          </div>
          <form id="add-chapter-form" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
            <input type="hidden" name="subjectId" value="${escapeHtml(sub.id)}" />
            <input type="text" name="chapterTitle" class="input" style="flex:1;min-width:160px;" placeholder="New chapter or topic title..." required aria-label="New chapter title" />
            <button type="submit" class="btn btn-primary">${getIcon('plus')} Add Chapter</button>

          ${subChapters.length === 0 ? `
            <div style="padding:20px;text-align:center;color:var(--text-muted);background:var(--bg-elevated);border-radius:8px;">
              No chapters added yet. Break this subject into chapters to track revision progress.
            </div>
          ` : `
            <div style="display:flex;flex-direction:column;gap:8px;">
              ${subChapters.map(ch => `
                <div class="card-elevated" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
                  <div style="font-weight:600;">${escapeHtml(ch.title)}</div>
                  <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
                    <button type="button" class="btn btn-sm ${ch.status === 'not_started' ? 'btn-secondary' : 'btn-ghost'}" data-action="set-chapter-status" data-chapter-id="${escapeHtml(ch.id)}" data-status="not_started">Not Started</button>
                    <button type="button" class="btn btn-sm ${ch.status === 'in_progress' ? 'btn-primary' : 'btn-ghost'}" data-action="set-chapter-status" data-chapter-id="${escapeHtml(ch.id)}" data-status="in_progress">In Progress</button>
                    <button type="button" class="btn btn-sm ${ch.status === 'completed' ? 'btn-success' : 'btn-ghost'}" data-action="set-chapter-status" data-chapter-id="${escapeHtml(ch.id)}" data-status="completed">Completed</button>

        <!-- Associated Tasks, Notes, and Flashcard Decks -->
        <div style="display:flex;flex-direction:column;gap:16px;">

              <h3 style="margin:0;font-size:15px;">Subject Tasks (${subTasks.length})</h3>
              <button type="button" class="btn btn-secondary btn-sm" data-action="open-task-modal" data-subject-id="${escapeHtml(sub.id)}">+ Add Task</button>
            </div>
            ${subTasks.length === 0 ? `<p style="margin:0;color:var(--text-muted);font-size:13px;">No tasks linked to this subject.</p>` : `
              <div style="display:flex;flex-direction:column;gap:6px;">
                ${subTasks.map(t => `
                  <div class="card-elevated" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
                    <div style="display:flex;align-items:center;gap:8px;">
                      <button type="button" class="btn btn-secondary btn-sm" data-action="toggle-task-complete" data-task-id="${escapeHtml(t.id)}">${t.completed ? getIcon('check') : '○'}</button>
                      <span style="${t.completed ? 'text-decoration:line-through;color:var(--text-muted);' : 'font-weight:500;'}">${escapeHtml(t.title)}</span>
                    </div>
                    <span class="badge badge-neutral">${escapeHtml(t.dueDate || '')}</span>

              </div>
