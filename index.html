            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
              <h3 style="margin:0;font-size:15px;">Subject Notes (${subNotes.length}) & Flashcard Decks (${subDecks.length})</h3>
              <div style="display:flex;gap:6px;">
                <button type="button" class="btn btn-secondary btn-sm" data-action="quick-new-note" data-subject-id="${escapeHtml(sub.id)}">+ Note</button>
                <button type="button" class="btn btn-secondary btn-sm" data-action="open-deck-modal" data-subject-id="${escapeHtml(sub.id)}">+ Deck</button>
              </div>
            </div>
            <div style="display:flex;flex-direction:column;gap:6px;">
              ${subNotes.map(n => `
                <div class="card-elevated card-interactive" data-action="open-note-from-link" data-note-id="${escapeHtml(n.id)}" style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
                  <span>${getIcon('notes')} ${escapeHtml(n.title)}</span>
                  <span class="badge badge-info">Note</span>
                </div>
              `).join('')}
              ${subDecks.map(d => `
                <div class="card-elevated card-interactive" data-action="open-deck-from-link" data-deck-id="${escapeHtml(d.id)}" style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
                  <span>${getIcon('flashcards')} ${escapeHtml(d.title)}</span>
                  <span class="badge badge-accent">Flashcard Deck</span>
                </div>
              `).join('')}
              ${(subNotes.length === 0 && subDecks.length === 0) ? `<p style="margin:0;color:var(--text-muted);font-size:13px;">No notes or flashcard decks linked yet.</p>` : ''}
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
}

// -----------------------------------------------------------------------------
// 3. TASK MANAGEMENT VIEW
// -----------------------------------------------------------------------------
function renderTasksView(stats) {
  const f = App.ui.taskFilter;
  const todayStr = stats.todayStr;
  const allTasks = (App.state.tasks || []).slice();

  const filtered = allTasks.filter(t => {
    if (f.search && !`${t.title} ${t.description || ''} ${(t.tags || []).join(' ')}`.toLowerCase().includes(f.search.toLowerCase())) {
      return false;
    }
    if (f.subjectId !== 'all' && t.subjectId !== f.subjectId) return false;
    if (f.priority !== 'all' && t.priority !== f.priority) return false;
    if (f.date && t.dueDate !== f.date) return false;

    if (f.status === 'completed') return Boolean(t.completed);
    if (f.status === 'overdue') return !t.completed && t.dueDate && t.dueDate < todayStr;
    if (f.status === 'upcoming') return !t.completed && (!t.dueDate || t.dueDate >= todayStr);
    if (f.status === 'unscheduled') return !t.completed && !t.scheduledDate;
    return true;
  });

  const pRank = { high: 3, medium: 2, low: 1 };
  filtered.sort((a, b) => {
    if (f.sortBy === 'priority') return (pRank[b.priority] || 2) - (pRank[a.priority] || 2);
    if (f.sortBy === 'createdAt') return String(b.createdAt || '').localeCompare(String(a.createdAt || ''));
    return String(a.dueDate || '9999-12-31').localeCompare(String(b.dueDate || '9999-12-31'));
  });

  return `
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px;">
        <div>
          <h1 style="margin:0 0 4px;font-size:22px;font-weight:700;">Task Management</h1>
          <p style="margin:0;color:var(--text-secondary);">
            ${stats.remainingTasksCount} remaining • ${stats.overdueTasks.length} overdue • ${stats.completedTasksCount} completed
          </p>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          ${App.ui.selectedTaskIds.length > 0 ? `
            <button type="button" class="btn btn-success btn-sm" data-action="bulk-complete-tasks">
              ${getIcon('check')} Complete Selected (${App.ui.selectedTaskIds.length})
            </button>
            <button type="button" class="btn btn-danger btn-sm" data-action="bulk-delete-tasks">
              ${getIcon('trash')} Delete Selected (${App.ui.selectedTaskIds.length})
            </button>
          ` : ''}
          <button type="button" class="btn btn-primary" data-action="open-task-modal">
            ${getIcon('plus')} New Task
          </button>
        </div>
      </div>

      <!-- Status Tabs -->
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:14px;">
        <div class="tabs-bar">
          ${[
            { id: 'all', label: `All (${allTasks.length})` },
            { id: 'upcoming', label: `Upcoming (${allTasks.filter(t => !t.completed && (!t.dueDate || t.dueDate >= todayStr)).length})` },
            { id: 'overdue', label: `Overdue (${stats.overdueTasks.length})` },
            { id: 'unscheduled', label: `Unscheduled (${stats.unscheduledTasks.length})` },
            { id: 'completed', label: `Completed (${stats.completedTasksCount})` }
          ].map(tab => `
            <button type="button" class="tab-btn ${f.status === tab.id ? 'active' : ''}" data-action="set-task-status-tab" data-status="${tab.id}">
              ${escapeHtml(tab.label)}
            </button>
          `).join('')}
        </div>
      </div>

      <!-- Filter & Sort Controls -->
      <div class="card" style="margin-bottom:18px;padding:14px;">
        <div class="grid-kpi" style="gap:10px;">
          <div>
            <label class="form-label" for="task-search-input">Search Title / Tags</label>
            <input id="task-search-input" type="text" class="input" placeholder="Search tasks..." value="${escapeHtml(f.search)}" />
          </div>
          <div>
            <label class="form-label" for="task-subject-filter">Subject</label>
            <select id="task-subject-filter" class="select">
              <option value="all">All Subjects</option>
              ${(App.state.subjects || []).map(s => `<option value="${escapeHtml(s.id)}" ${f.subjectId === s.id ? 'selected' : ''}>${escapeHtml(s.name)}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="form-label" for="task-priority-filter">Priority</label>
            <select id="task-priority-filter" class="select">
              <option value="all" ${f.priority === 'all' ? 'selected' : ''}>All Priorities</option>
              <option value="high" ${f.priority === 'high' ? 'selected' : ''}>High</option>
              <option value="medium" ${f.priority === 'medium' ? 'selected' : ''}>Medium</option>
              <option value="low" ${f.priority === 'low' ? 'selected' : ''}>Low</option>
            </select>
          </div>
          <div>
            <label class="form-label" for="task-sort-select">Sort By</label>
            <select id="task-sort-select" class="select">
              <option value="dueDate" ${f.sortBy === 'dueDate' ? 'selected' : ''}>Deadline (Soonest)</option>
              <option value="priority" ${f.sortBy === 'priority' ? 'selected' : ''}>Priority (Highest)</option>
              <option value="createdAt" ${f.sortBy === 'createdAt' ? 'selected' : ''}>Recently Created</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Tasks List -->
      ${filtered.length === 0 ? `
        <div class="card" style="text-align:center;padding:36px 20px;">
          <h3 style="margin:0 0 6px;">No matching tasks found</h3>
          <p style="margin:0 0 14px;color:var(--text-secondary);">Adjust your filters or add a new study task.</p>
          <button type="button" class="btn btn-primary btn-sm" data-action="open-task-modal">${getIcon('plus')} Create Task</button>
        </div>
      ` : `
        <div style="display:flex;flex-direction:column;gap:10px;">
          ${filtered.map(task => {
            const isOverdue = !task.completed && task.dueDate && task.dueDate < todayStr;
            const isSelected = App.ui.selectedTaskIds.includes(task.id);
            const ch = getChapterById(task.chapterId);
            return `
              <div class="card" style="padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;${isOverdue ? 'border-left:4px solid var(--danger);' : ''}">
                <div style="display:flex;align-items:flex-start;gap:12px;min-width:0;flex:1;">
                  <input type="checkbox" aria-label="Select task ${escapeHtml(task.title)}" data-action="select-task-bulk" data-task-id="${escapeHtml(task.id)}" ${isSelected ? 'checked' : ''} style="margin-top:5px;" />
                  <button type="button" class="btn ${task.completed ? 'btn-success' : 'btn-secondary'} btn-sm" data-action="toggle-task-complete" data-task-id="${escapeHtml(task.id)}" title="${task.completed ? 'Reopen Task' : 'Mark Completed'}">
                    ${task.completed ? getIcon('check') : '○'}
                  </button>
                  <div style="min-width:0;flex:1;">
                    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                      <span style="font-weight:600;font-size:15px;cursor:pointer;${task.completed ? 'text-decoration:line-through;color:var(--text-muted);' : ''}" data-action="open-task-detail" data-task-id="${escapeHtml(task.id)}">
                        ${escapeHtml(task.title)}
                      </span>
                      ${isOverdue ? '<span class="badge badge-danger">OVERDUE</span>' : ''}
                      ${renderSubjectBadge(task.subjectId)}
                      ${ch ? `<span class="badge badge-neutral">${escapeHtml(ch.title)}</span>` : ''}
                      ${renderPriorityBadge(task.priority)}
                    </div>
                    ${task.description ? `<p style="margin:4px 0;color:var(--text-secondary);font-size:13px;">${escapeHtml(task.description)}</p>` : ''}
                    <div style="display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text-muted);margin-top:4px;">
                      <span>Due: <strong>${escapeHtml(task.dueDate || 'None')}${task.dueTime ? ' ' + escapeHtml(task.dueTime) : ''}</strong></span>
                      <span>Est: <strong>${task.estimatedMinutes || 45}m</strong></span>
                      ${task.scheduledDate ? `<span style="color:var(--info);">Scheduled: ${escapeHtml(task.scheduledDate)} ${escapeHtml(task.scheduledStartTime || '')}</span>` : '<span>Unscheduled</span>'}
                      ${(task.tags || []).map(tag => `<span class="badge badge-neutral">#${escapeHtml(tag)}</span>`).join('')}
                    </div>
                  </div>
                </div>
                <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
                  ${!task.completed ? `
                    <button type="button" class="btn btn-secondary btn-sm" data-action="start-task-focus" data-task-id="${escapeHtml(task.id)}">
                      ${getIcon('timer')} Focus
                    </button>
                  ` : ''}
                  <button type="button" class="btn btn-ghost btn-sm" data-action="open-task-detail" data-task-id="${escapeHtml(task.id)}">
                    ${getIcon('edit')} Edit
                  </button>
                  <button type="button" class="btn btn-danger btn-sm" data-action="delete-task" data-task-id="${escapeHtml(task.id)}" aria-label="Delete task">
                    ${getIcon('trash')}
                  </button>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `}
    </div>
  `;
}

// -----------------------------------------------------------------------------
// 4. SMART STUDY PLANNER VIEW
// -----------------------------------------------------------------------------
function renderPlannerView(stats) {
  const prefs = App.state.preferences || {};
  const todayStr = stats.todayStr;
  const selectedDate = App.ui.plannerSelectedDate || todayStr;
  const sessions = App.state.scheduledSessions || [];
  const { conflicts, conflictingIds } = detectScheduleConflicts(sessions);

  const daySessions = sessions
    .filter(s => s.sessionDate === selectedDate)
    .sort((a, b) => timeStrToMinutes(a.startTime) - timeStrToMinutes(b.startTime));
  const totalDayMinutes = daySessions.reduce((acc, s) => acc + Number(s.durationMinutes || 0), 0);
  const availableDayMinutes = Math.round(Number(prefs.availableDailyHours || 4) * 60);

  let mainPlannerBody = '';

  if (App.ui.plannerView === 'daily') {
    mainPlannerBody = `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px;">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <label for="planner-date-picker" class="form-label" style="margin:0;">Selected Date:</label>
            <input id="planner-date-picker" type="date" class="input" style="width:auto;" value="${escapeHtml(selectedDate)}" />
            <button type="button" class="btn btn-ghost btn-sm" data-action="planner-set-today">Today</button>
          </div>
          <div style="font-size:13px;color:var(--text-secondary);">
            Scheduled: <strong>${formatDuration(totalDayMinutes)}</strong> / ${formatDuration(availableDayMinutes)} daily capacity
          </div>
        </div>

        ${daySessions.length === 0 ? `
          <div style="padding:32px;text-align:center;color:var(--text-muted);background:var(--bg-elevated);border-radius:10px;">
            <p style="margin:0 0 12px;">No revision sessions scheduled on ${escapeHtml(selectedDate)}.</p>
            <button type="button" class="btn btn-primary btn-sm" data-action="open-schedule-modal" data-date="${escapeHtml(selectedDate)}">+ Schedule Session</button>
          </div>
        ` : `
          <div style="display:flex;flex-direction:column;gap:10px;">
            ${daySessions.map(sess => {
              const hasConflict = conflictingIds.has(sess.id);
              const endMin = timeStrToMinutes(sess.startTime) + Number(sess.durationMinutes || 45);
              return `
                <div class="card-elevated" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;${hasConflict ? 'border:1px solid var(--danger);' : ''}">
                  <div>
                    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;">
                      <span class="badge badge-accent">${escapeHtml(sess.startTime)} – ${minutesToTimeStr(endMin)} (${sess.durationMinutes}m)</span>
                      ${renderSubjectBadge(sess.subjectId)}
                      ${hasConflict ? '<span class="badge badge-danger">TIME CONFLICT</span>' : ''}
                    </div>
                    <div style="font-weight:600;font-size:15px;">${escapeHtml(sess.title)}</div>
                    ${sess.notes ? `<div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">${escapeHtml(sess.notes)}</div>` : ''}
                  </div>
                  <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
                    <button type="button" class="btn btn-primary btn-sm" data-action="start-focus-from-session" data-session-id="${escapeHtml(sess.id)}">
                      ${getIcon('play')} Start Focus
                    </button>
                    <button type="button" class="btn btn-secondary btn-sm" data-action="edit-scheduled-session" data-session-id="${escapeHtml(sess.id)}">
                      Reschedule
                    </button>
                    <button type="button" class="btn btn-danger btn-sm" data-action="delete-scheduled-session" data-session-id="${escapeHtml(sess.id)}" aria-label="Remove session">
                      ${getIcon('trash')}
                    </button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `}
      </div>
    `;
  } else if (App.ui.plannerView === 'weekly') {
    const days = [];
    for (let i = 0; i < 7; i++) {
      const dStr = addDaysToDateString(todayStr, i);
      const dSessions = sessions
        .filter(s => s.sessionDate === dStr)
        .sort((a, b) => timeStrToMinutes(a.startTime) - timeStrToMinutes(b.startTime));
      days.push({ dateStr: dStr, sessions: dSessions });
    }
    mainPlannerBody = `
      <div class="grid-3">
        ${days.map(day => `
          <div class="card" style="${day.dateStr === todayStr ? 'border-color:var(--accent);' : ''}">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
              <strong>${escapeHtml(day.dateStr)} ${day.dateStr === todayStr ? '(Today)' : ''}</strong>
              <button type="button" class="btn btn-ghost btn-sm" data-action="open-schedule-modal" data-date="${escapeHtml(day.dateStr)}">+ Add</button>
            </div>
            ${day.sessions.length === 0 ? `<p style="margin:0;color:var(--text-muted);font-size:12px;">No sessions</p>` : `
              <div style="display:flex;flex-direction:column;gap:8px;">
                ${day.sessions.map(s => `
                  <div class="card-elevated" style="padding:8px 10px;">
                    <div style="font-size:11px;color:var(--accent);font-weight:600;">${escapeHtml(s.startTime)} (${s.durationMinutes}m)</div>
                    <div style="font-weight:600;font-size:13px;margin:2px 0;">${escapeHtml(s.title)}</div>
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;">
                      ${renderSubjectBadge(s.subjectId)}
                      <button type="button" class="btn btn-ghost btn-sm" data-action="edit-scheduled-session" data-session-id="${escapeHtml(s.id)}">Edit</button>
                    </div>
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        `).join('')}
      </div>
    `;
  } else if (App.ui.plannerView === 'upcoming') {
    const upcomingList = sessions
      .filter(s => s.sessionDate >= todayStr)
      .sort((a, b) => `${a.sessionDate} ${a.startTime}`.localeCompare(`${b.sessionDate} ${b.startTime}`));
    mainPlannerBody = `
      <div class="card">
        <h3 style="margin:0 0 12px;font-size:16px;">All Upcoming Scheduled Sessions (${upcomingList.length})</h3>
        ${upcomingList.length === 0 ? `<p style="color:var(--text-muted);margin:0;">No upcoming sessions scheduled.</p>` : `
          <div style="display:flex;flex-direction:column;gap:8px;">
            ${upcomingList.map(s => `
              <div class="card-elevated" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
                <div>
                  <span class="badge badge-accent">${escapeHtml(s.sessionDate)} • ${escapeHtml(s.startTime)} (${s.durationMinutes}m)</span>
                  <strong style="margin-left:8px;">${escapeHtml(s.title)}</strong>
                  <span style="margin-left:8px;">${renderSubjectBadge(s.subjectId)}</span>
                </div>
                <div style="display:flex;gap:6px;">
                  <button type="button" class="btn btn-secondary btn-sm" data-action="edit-scheduled-session" data-session-id="${escapeHtml(s.id)}">Reschedule</button>
                  <button type="button" class="btn btn-danger btn-sm" data-action="delete-scheduled-session" data-session-id="${escapeHtml(s.id)}">${getIcon('trash')}</button>
                </div>
              </div>
            `).join('')}
          </div>
        `}
      </div>
    `;
  } else {
    // Unscheduled tasks view
    mainPlannerBody = `
      <div class="card">
        <h3 style="margin:0 0 12px;font-size:16px;">Unscheduled Tasks Queue (${stats.unscheduledTasks.length})</h3>
        ${stats.unscheduledTasks.length === 0 ? `<p style="color:var(--text-muted);margin:0;">All incomplete tasks have been scheduled!</p>` : `
          <div style="display:flex;flex-direction:column;gap:8px;">
            ${stats.unscheduledTasks.map(t => `
              <div class="card-elevated" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
                <div>
                  <strong>${escapeHtml(t.title)}</strong>
                  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;">
                    ${renderSubjectBadge(t.subjectId)}
                    ${renderPriorityBadge(t.priority)}
                    <span class="badge badge-neutral">Due: ${escapeHtml(t.dueDate || 'No date')}</span>
                    <span class="badge badge-neutral">Est: ${t.estimatedMinutes || 45}m</span>
                  </div>
                </div>
                <button type="button" class="btn btn-primary btn-sm" data-action="schedule-existing-task" data-task-id="${escapeHtml(t.id)}">
                  ${getIcon('planner')} Schedule Slot
                </button>
              </div>
            `).join('')}
          </div>
        `}
      </div>
    `;
  }

  const proposal = App.ui.proposedScheduleResult;
  const proposalHtml = proposal ? `
    <div class="card" style="margin-bottom:20px;border:2px solid var(--accent);">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px;">
        <div>
          <span class="badge badge-accent">SMART SCHEDULE PROPOSAL PREVIEW</span>
          <h3 style="margin:6px 0 4px;">Proposed Revision Plan (${proposal.proposedSessions.length} sessions across ${proposal.candidateCount} unscheduled tasks)</h3>
          <p style="margin:0;color:var(--text-secondary);font-size:13px;">
            Review the proposed time slots below. Applying this schedule preserves all existing sessions and never schedules in the past.
          </p>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button type="button" class="btn btn-success" data-action="apply-proposed-schedule">
            ${getIcon('check')} Apply Schedule (${proposal.proposedSessions.length})
          </button>
          <button type="button" class="btn btn-ghost" data-action="discard-proposed-schedule">Discard</button>
        </div>
      </div>

      ${proposal.warnings.length > 0 ? `
        <div class="card-elevated" style="border-left:4px solid var(--warning);margin-bottom:12px;">
          <div style="font-weight:600;color:var(--warning);margin-bottom:4px;">Scheduling Constraints & Capacity Warnings:</div>
          <ul style="margin:0;padding-left:18px;font-size:12px;color:var(--text-secondary);">
            ${proposal.warnings.map(w => `<li>${escapeHtml(w)}</li>`).join('')}
          </ul>
        </div>
      ` : ''}

      ${proposal.proposedSessions.length === 0 ? `
        <p style="margin:0;color:var(--text-muted);">No additional unscheduled tasks could be placed or all tasks are already scheduled.</p>
      ` : `
        <div style="display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto;">
          ${proposal.proposedSessions.map(ps => `
            <div class="card-elevated" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;">
              <div>
                <span class="badge badge-accent">${escapeHtml(ps.sessionDate)} • ${escapeHtml(ps.startTime)} (${ps.durationMinutes}m)</span>
                <strong style="margin-left:8px;">${escapeHtml(ps.title)}</strong>
                <span style="margin-left:6px;">${renderSubjectBadge(ps.subjectId)}</span>
              </div>
              <span style="font-size:12px;color:var(--text-secondary);">${escapeHtml(ps.notes)}</span>
            </div>
          `).join('')}
        </div>
      `}
    </div>
  ` : '';

  return `
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px;">
        <div>
          <h1 style="margin:0 0 4px;font-size:22px;font-weight:700;">Smart Study Planner</h1>
          <p style="margin:0;color:var(--text-secondary);">
            Window: ${escapeHtml(prefs.studyWindowStart || '09:00')} – ${escapeHtml(prefs.studyWindowEnd || '20:00')} • Max ${prefs.availableDailyHours || 4}h/day • Default ${prefs.defaultSessionMinutes || 45}m sessions
          </p>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button type="button" class="btn btn-secondary" data-action="generate-smart-schedule">
            ${getIcon('assistant')} Auto-Generate Revision Schedule
          </button>
          <button type="button" class="btn btn-primary" data-action="open-schedule-modal">
            ${getIcon('plus')} Schedule Session
          </button>
        </div>
      </div>

      <!-- Conflict Detection Alert -->
      ${conflicts.length > 0 ? `
        <div class="card" style="margin-bottom:18px;border-left:4px solid var(--danger);background:var(--danger-soft);">
          <div style="display:flex;align-items:center;gap:8px;font-weight:700;color:var(--danger);margin-bottom:6px;">
            ${getIcon('alert')} ${conflicts.length} Schedule Conflict(s) Detected
          </div>
          <ul style="margin:0;padding-left:18px;font-size:13px;">
            ${conflicts.map(c => `<li>${escapeHtml(c.message)}</li>`).join('')}
          </ul>
        </div>
      ` : ''}

      ${proposalHtml}

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;">
        <div class="tabs-bar">
          <button type="button" class="tab-btn ${App.ui.plannerView === 'daily' ? 'active' : ''}" data-action="set-planner-view" data-view="daily">Daily Agenda</button>
          <button type="button" class="tab-btn ${App.ui.plannerView === 'weekly' ? 'active' : ''}" data-action="set-planner-view" data-view="weekly">Weekly Calendar</button>
          <button type="button" class="tab-btn ${App.ui.plannerView === 'upcoming' ? 'active' : ''}" data-action="set-planner-view" data-view="upcoming">Upcoming Schedule</button>
          <button type="button" class="tab-btn ${App.ui.plannerView === 'unscheduled' ? 'active' : ''}" data-action="set-planner-view" data-view="unscheduled">Unscheduled Tasks (${stats.unscheduledTasks.length})</button>
        </div>
      </div>

      ${mainPlannerBody}
    </div>
  `;
}

// -----------------------------------------------------------------------------
// 5. FOCUS TIMER VIEW
// -----------------------------------------------------------------------------
function getTimerElapsedSeconds() {
  const t = App.ui.timer;
  let elapsedMs = Number(t.accumulatedElapsedMs || 0);
  if (t.status === 'running' && t.startedAtEpochMs) {
    elapsedMs += Math.max(0, Date.now() - t.startedAtEpochMs);
  }
  return Math.floor(elapsedMs / 1000);
}

function renderTimerView(stats) {
  const t = App.ui.timer;
  const elapsedSec = getTimerElapsedSeconds();
  const remainingSec = Math.max(0, t.targetDurationSec - elapsedSec);
  const progressPct = t.targetDurationSec > 0
    ? Math.min(100, Math.round((elapsedSec / t.targetDurationSec) * 100))
    : 0;

  const radius = 104;
  const circumference = 2 * Math.PI * radius;
  const dashOffset = circumference - (progressPct / 100) * circumference;

  const subjectTasks = (App.state.tasks || []).filter(
    task => !task.completed && (!t.subjectId || task.subjectId === t.subjectId)
  );

  const history = (App.state.focusSessions || [])
    .slice()
    .sort((a, b) => String(b.startTime).localeCompare(String(a.startTime)));

  return `
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;">
        <div>
          <h1 style="margin:0 0 4px;font-size:22px;font-weight:700;">Focus Timer</h1>
          <p style="margin:0;color:var(--text-secondary);">
            Reliable timestamp-based focus tracking. Sessions under 60 seconds, break time, and unconfirmed expired sessions are never counted toward study hours.
          </p>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          <span class="badge badge-accent">Today's Focus: ${formatDuration(stats.studyMinutesToday)} / ${formatDuration(stats.dailyGoal)}</span>
        </div>
      </div>

      <div class="grid-2" style="margin-bottom:24px;">
        <!-- Distraction-Free Circular Timer Card -->
        <div class="card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;">
          <div class="tabs-bar" style="margin-bottom:20px;justify-content:center;">
            <button type="button" class="tab-btn ${t.mode === 'focus' ? 'active' : ''}" data-action="set-timer-mode" data-mode="focus" ${t.status !== 'idle' ? 'disabled' : ''}>
              Focus (${App.state.preferences.focusDurationMinutes || 25}m)
            </button>
            <button type="button" class="tab-btn ${t.mode === 'short_break' ? 'active' : ''}" data-action="set-timer-mode" data-mode="short_break" ${t.status !== 'idle' ? 'disabled' : ''}>
              Short Break (${App.state.preferences.shortBreakMinutes || 5}m)
            </button>
            <button type="button" class="tab-btn ${t.mode === 'long_break' ? 'active' : ''}" data-action="set-timer-mode" data-mode="long_break" ${t.status !== 'idle' ? 'disabled' : ''}>
              Long Break (${App.state.preferences.longBreakMinutes || 15}m)
            </button>
          </div>

          <div style="position:relative;width:240px;height:240px;max-width:100%;display:flex;align-items:center;justify-content:center;margin-bottom:20px;">
            <svg width="240" height="240" viewBox="0 0 240 240" style="transform:rotate(-90deg);max-width:100%;height:auto;">
              <circle cx="120" cy="120" r="${radius}" stroke="var(--bg-elevated)" stroke-width="10" fill="none" />
              <circle id="timer-progress-circle" cx="120" cy="120" r="${radius}" stroke="${t.mode === 'focus' ? 'var(--accent)' : 'var(--success)'}" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${circumference.toFixed(1)}" stroke-dashoffset="${dashOffset.toFixed(1)}" />
            </svg>
            <div style="position:absolute;text-align:center;">
              <div id="timer-clock-display" style="font-size:44px;font-weight:800;letter-spacing:-0.03em;font-variant-numeric:tabular-nums;">
                ${formatTimerClock(remainingSec)}
              </div>
              <div style="font-size:12px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.06em;">
                ${t.mode === 'focus' ? 'Deep Focus' : t.mode === 'short_break' ? 'Short Break' : 'Long Break'} • ${escapeHtml(t.status)}
              </div>
            </div>
          </div>

          <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
            ${t.status === 'idle' ? `
              <button type="button" class="btn btn-primary btn-lg" data-action="timer-start">
                ${getIcon('play')} Start ${t.mode === 'focus' ? 'Focus' : 'Break'}
              </button>
            ` : ''}
            ${t.status === 'running' ? `
              <button type="button" class="btn btn-secondary btn-lg" data-action="timer-pause">
                ${getIcon('pause')} Pause
              </button>
            ` : ''}
            ${t.status === 'paused' ? `
              <button type="button" class="btn btn-primary btn-lg" data-action="timer-resume">
                ${getIcon('play')} Resume
              </button>
            ` : ''}
            ${t.status !== 'idle' ? `
              <button type="button" class="btn btn-success btn-lg" data-action="timer-complete">
                ${getIcon('check')} Finish & Log
              </button>
              <button type="button" class="btn btn-danger btn-lg" data-action="timer-reset">
                Abandon / Reset
              </button>
            ` : ''}
          </div>
        </div>

        <!-- Session Context & Configuration -->
        <div class="card" style="display:flex;flex-direction:column;justify-content:space-between;">
          <div>
            <h3 style="margin:0 0 14px;font-size:16px;">Session Association & Target</h3>
            <div class="form-group">
              <label class="form-label" for="timer-subject-select">Associated Subject</label>
              <select id="timer-subject-select" class="select">
                <option value="">General Study (No Specific Subject)</option>
                ${(App.state.subjects || []).filter(s => !s.archived).map(s => `
                  <option value="${escapeHtml(s.id)}" ${t.subjectId === s.id ? 'selected' : ''}>${escapeHtml(s.name)}</option>
                `).join('')}
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="timer-task-select">Associated Task (Optional)</label>
              <select id="timer-task-select" class="select">
                <option value="">No specific task selected</option>
                ${subjectTasks.map(task => `
                  <option value="${escapeHtml(task.id)}" ${t.taskId === task.id ? 'selected' : ''}>${escapeHtml(task.title)}</option>
                `).join('')}
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="timer-custom-minutes">Custom Duration (Minutes)</label>
              <div style="display:flex;gap:8px;">
                <input id="timer-custom-minutes" type="number" min="1" max="180" class="input" value="${Math.round(t.targetDurationSec / 60)}" ${t.status !== 'idle' ? 'disabled' : ''} />
                <button type="button" class="btn btn-secondary" data-action="apply-custom-timer-minutes" ${t.status !== 'idle' ? 'disabled' : ''}>Set</button>
              </div>
            </div>
          </div>

          <div class="card-elevated">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px;">
              <span style="font-size:12px;font-weight:600;color:var(--text-secondary);">DAILY FOCUS GOAL PROGRESS</span>
              <span style="font-size:12px;font-weight:700;">${formatDuration(stats.studyMinutesToday)} / ${formatDuration(stats.dailyGoal)} (${stats.dailyGoalPct}%)</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width:${stats.dailyGoalPct}%;"></div>
            </div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:8px;">
              Completed Sessions: <strong>${stats.completedFocusCount}</strong> • Interrupted Sessions: <strong>${stats.interruptedFocusCount}</strong>
            </div>
          </div>
        </div>
      </div>

      <!-- Focus Session History & Safeguard Log -->
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
          <h3 style="margin:0;font-size:16px;">Recorded Focus Session History (${history.length})</h3>
          <button type="button" class="btn btn-secondary btn-sm" data-action="open-manual-session-modal">+ Log Manual / Offline Focus Session</button>
        </div>
        ${history.length === 0 ? `
          <p style="margin:0;color:var(--text-muted);">No sessions recorded yet.</p>
        ` : `
          <div style="display:flex;flex-direction:column;gap:8px;">
            ${history.map(item => {
              const statusLabel = item.status === 'needs_review' ? 'NEEDS REVIEW' : String(item.status || '').toUpperCase();
              const badgeClass = item.status === 'completed' ? 'badge-success' : item.status === 'needs_review' ? 'badge-danger' : 'badge-warning';
              return `
                <div class="card-elevated" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;${item.status === 'needs_review' ? 'border-left:4px solid var(--warning);' : ''}">
                  <div>
                    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                      <span class="badge ${badgeClass}">${escapeHtml(statusLabel)}</span>
                      <strong>${formatDuration(item.durationMinutes)}</strong>
                      ${renderSubjectBadge(item.subjectId)}
                    </div>
                    <div style="font-size:12px;color:var(--text-secondary);margin-top:3px;">
                      Started: ${escapeHtml(String(item.startTime || '').slice(0, 16).replace('T', ' '))} • Ended: ${escapeHtml(String(item.endTime || '').slice(0, 16).replace('T', ' '))} • Planned: ${item.plannedMinutes || 25}m
                    </div>
                  </div>
                  <div style="display:flex;gap:6px;flex-wrap:wrap;">
                    ${item.status === 'needs_review' ? `
                      <button type="button" class="btn btn-success btn-sm" data-action="approve-focus-session" data-session-id="${escapeHtml(item.id)}">
                        ${getIcon('check')} Confirm Completed
                      </button>
                    ` : ''}
                    <button type="button" class="btn btn-ghost btn-sm" data-action="edit-focus-session" data-session-id="${escapeHtml(item.id)}">
                      ${getIcon('edit')} Correct
                    </button>
                    <button type="button" class="btn btn-danger btn-sm" data-action="delete-focus-session" data-session-id="${escapeHtml(item.id)}" aria-label="Remove session record">
                      ${getIcon('trash')}
                    </button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `}
      </div>
    </div>
  `;
}

// StudyOS — Views Part 2:

// -----------------------------------------------------------------------------
// 6. FLASHCARDS & SPACED REPETITION VIEW
// -----------------------------------------------------------------------------
function renderFlashcardsView(stats) {
  const fc = App.ui.flashcards;
  const todayStr = stats.todayStr;
  const decks = App.state.flashcardDecks || [];
  const allCards = App.state.flashcards || [];

  if (fc.activeDeckId && fc.mode !== 'list') {
    const deck = decks.find(d => d.id === fc.activeDeckId);
    if (deck) {
      if (fc.mode === 'manage') return renderDeckManageView(deck, todayStr);
      if (fc.mode === 'review') return renderDeckReviewView(deck, todayStr);
      if (fc.mode === 'quiz') return renderDeckQuizView(deck);
    }
    fc.activeDeckId = null;
    fc.mode = 'list';
  }

  return `
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;">
        <div>
          <h1 style="margin:0 0 4px;font-size:22px;font-weight:700;">Flashcards & Spaced Repetition</h1>
          <p style="margin:0;color:var(--text-secondary);">
            Total Cards: <strong>${stats.totalCardsCount}</strong> • Due Today: <strong>${stats.dueCardsCount}</strong> • Review Accuracy: <strong>${stats.flashcardAccuracyPct}%</strong> (${stats.reviewsCount} reviews)
          </p>
        </div>
        <button type="button" class="btn btn-primary" data-action="open-deck-modal">
          ${getIcon('plus')} New Flashcard Deck
        </button>
      </div>

      ${decks.length === 0 ? `
        <div class="card" style="text-align:center;padding:40px 20px;">
          <h3 style="margin:0 0 8px;">No flashcard decks created yet</h3>
          <p style="margin:0 0 16px;color:var(--text-secondary);">Create a deck to practice active recall with spaced repetition scheduling and quiz mode.</p>
          <button type="button" class="btn btn-primary" data-action="open-deck-modal">${getIcon('plus')} Create First Deck</button>
        </div>
      ` : `
        <div class="grid-3">
          ${decks.map(deck => {
            const deckCards = allCards.filter(c => c.deckId === deck.id);
            const dueCount = deckCards.filter(c => !c.nextReviewDate || c.nextReviewDate <= todayStr).length;
            const hardCount = deckCards.filter(c => c.difficulty === 'hard').length;
            const reviewedCount = deckCards.filter(c => Number(c.repetitions || 0) > 0).length;
            return `
              <div class="card" style="display:flex;flex-direction:column;justify-content:space-between;">
                <div>
                  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;">
                    <h3 style="margin:0;font-size:16px;font-weight:700;">${escapeHtml(deck.title)}</h3>
                    <span class="badge ${dueCount > 0 ? 'badge-warning' : 'badge-success'}">${dueCount} due</span>
                  </div>
                  <div style="margin-bottom:8px;">${renderSubjectBadge(deck.subjectId)}</div>
                  <p style="margin:0 0 12px;color:var(--text-secondary);font-size:13px;">${escapeHtml(deck.description || 'No description.')}</p>
                  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;color:var(--text-secondary);margin-bottom:14px;">
                    <div>Cards: <strong>${deckCards.length}</strong></div>
                    <div>Reviewed: <strong>${reviewedCount}</strong></div>
                    <div>Hard: <strong>${hardCount}</strong></div>
                  </div>
                </div>
                <div style="display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--border-subtle);">
                  <div style="display:flex;gap:6px;flex-wrap:wrap;">
                    <button type="button" class="btn btn-primary btn-sm" style="flex:1;" data-action="start-deck-review" data-deck-id="${escapeHtml(deck.id)}" data-filter="due">
                      Review Due (${dueCount})
                    </button>
                    <button type="button" class="btn btn-secondary btn-sm" style="flex:1;" data-action="start-deck-review" data-deck-id="${escapeHtml(deck.id)}" data-filter="all">
                      Study All
                    </button>
                    <button type="button" class="btn btn-secondary btn-sm" data-action="start-deck-quiz" data-deck-id="${escapeHtml(deck.id)}">
                      Quiz
                    </button>
                  </div>
                  <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;">
                    <button type="button" class="btn btn-ghost btn-sm" data-action="manage-deck-cards" data-deck-id="${escapeHtml(deck.id)}">
                      Manage Cards (${deckCards.length})
                    </button>
                    <div style="display:flex;gap:4px;">
                      <button type="button" class="btn btn-ghost btn-sm" data-action="edit-deck" data-deck-id="${escapeHtml(deck.id)}" aria-label="Edit deck">${getIcon('edit')}</button>
                      <button type="button" class="btn btn-danger btn-sm" data-action="delete-deck" data-deck-id="${escapeHtml(deck.id)}" aria-label="Delete deck">${getIcon('trash')}</button>
                    </div>
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `}
    </div>
  `;
}

function renderDeckManageView(deck, todayStr) {
  const deckCards = (App.state.flashcards || []).filter(c => c.deckId === deck.id);
  return `
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
        <button type="button" class="btn btn-ghost btn-sm" data-action="exit-deck-subview">${getIcon('arrowLeft')} Back to Decks</button>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button type="button" class="btn btn-secondary btn-sm" data-action="start-deck-review" data-deck-id="${escapeHtml(deck.id)}" data-filter="all">Practice Flip Mode</button>
          <button type="button" class="btn btn-primary btn-sm" data-action="open-card-modal" data-deck-id="${escapeHtml(deck.id)}">${getIcon('plus')} Add Flashcard</button>
        </div>
      </div>

      <div class="card" style="margin-bottom:18px;">
        <h2 style="margin:0 0 4px;">${escapeHtml(deck.title)} — Cards (${deckCards.length})</h2>
        <p style="margin:0;color:var(--text-secondary);">${escapeHtml(deck.description || '')}</p>
      </div>

      ${deckCards.length === 0 ? `
        <div class="card" style="text-align:center;padding:32px;">
          <p style="margin:0 0 12px;color:var(--text-muted);">This deck has no cards yet.</p>
          <button type="button" class="btn btn-primary btn-sm" data-action="open-card-modal" data-deck-id="${escapeHtml(deck.id)}">${getIcon('plus')} Add First Card</button>
        </div>
      ` : `
        <div style="display:flex;flex-direction:column;gap:10px;">
          ${deckCards.map(card => `
            <div class="card-elevated" style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
              <div style="flex:1;min-width:0;">
                <div style="font-weight:700;margin-bottom:4px;">Q: ${escapeHtml(card.question)}</div>
                <div style="color:var(--text-secondary);margin-bottom:4px;">A: ${escapeHtml(card.answer)}</div>
                ${card.explanation ? `<div style="font-size:12px;color:var(--text-muted);">Explanation: ${escapeHtml(card.explanation)}</div>` : ''}
                <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;">
                  <span class="badge ${card.difficulty === 'hard' ? 'badge-danger' : card.difficulty === 'easy' ? 'badge-success' : 'badge-neutral'}">Difficulty: ${escapeHtml(card.difficulty || 'unrated')}</span>
                  <span class="badge badge-info">Next Review: ${escapeHtml(card.nextReviewDate || todayStr)}</span>
                  <span class="badge badge-neutral">Interval: ${card.intervalDays || 0}d (Reps: ${card.repetitions || 0})</span>
                </div>
              </div>
              <div style="display:flex;gap:6px;">
                <button type="button" class="btn btn-ghost btn-sm" data-action="edit-card" data-card-id="${escapeHtml(card.id)}">${getIcon('edit')}</button>
                <button type="button" class="btn btn-danger btn-sm" data-action="delete-card" data-card-id="${escapeHtml(card.id)}">${getIcon('trash')}</button>
              </div>
            </div>
          `).join('')}
        </div>
      `}
    </div>
  `;
}

function renderDeckReviewView(deck, todayStr) {
  const fc = App.ui.flashcards;
  const queue = fc.cardsQueue || [];
  if (queue.length === 0 || fc.currentIndex >= queue.length) {
    return `
      <div class="card" style="text-align:center;padding:40px 20px;">
        <h2 style="margin:0 0 8px;">Review Session Complete!</h2>
        <p style="margin:0 0 18px;color:var(--text-secondary);">
          ${queue.length === 0 ? 'No cards matched this filter or all due cards have been reviewed for today.' : `You reviewed ${queue.length} card(s) in "${escapeHtml(deck.title)}".`}
        </p>
        <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;">
          <button type="button" class="btn btn-secondary" data-action="start-deck-review" data-deck-id="${escapeHtml(deck.id)}" data-filter="all">Review All Cards Again</button>
          <button type="button" class="btn btn-primary" data-action="exit-deck-subview">Return to Decks</button>
        </div>
      </div>
    `;
  }

  const card = queue[fc.currentIndex];
  return `
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px;">
        <button type="button" class="btn btn-ghost btn-sm" data-action="exit-deck-subview">${getIcon('arrowLeft')} Exit Review</button>
        <div style="font-weight:600;">${escapeHtml(deck.title)} — Card ${fc.currentIndex + 1} of ${queue.length}</div>
        <button type="button" class="btn btn-secondary btn-sm" data-action="shuffle-review-cards">${getIcon('refresh')} Shuffle Queue</button>
      </div>

      <div class="flashcard-box" data-action="flip-current-card" role="button" tabindex="0" aria-label="Flip flashcard">
        <span class="badge ${fc.isFlipped ? 'badge-success' : 'badge-accent'}" style="margin-bottom:12px;">
          ${fc.isFlipped ? 'ANSWER & EXPLANATION' : 'QUESTION (CLICK TO REVEAL ANSWER)'}
        </span>
        <div style="font-size:20px;font-weight:700;max-width:640px;">
          ${escapeHtml(fc.isFlipped ? card.answer : card.question)}
        </div>
        ${fc.isFlipped && card.explanation ? `
          <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border-strong);color:var(--text-secondary);font-size:14px;max-width:600px;">
            ${escapeHtml(card.explanation)}
          </div>
        ` : ''}
      </div>

      <div style="margin-top:18px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;">
        ${!fc.isFlipped ? `
          <button type="button" class="btn btn-primary btn-lg" data-action="flip-current-card">Reveal Answer</button>
        ` : `
          <button type="button" class="btn btn-danger btn-lg" data-action="rate-flashcard" data-rating="hard">
            Difficult / Again (1d)
          </button>
          <button type="button" class="btn btn-secondary btn-lg" data-action="rate-flashcard" data-rating="medium">
            Uncertain / Good (2–4d)
          </button>
          <button type="button" class="btn btn-success btn-lg" data-action="rate-flashcard" data-rating="easy">
            Easy / Confident (4–7d+)
          </button>
        `}
      </div>
    </div>
  `;
}

function renderDeckQuizView(deck) {
  const fc = App.ui.flashcards;
  const queue = fc.cardsQueue || [];
  if (queue.length === 0) {
    return `
      <div class="card" style="text-align:center;padding:32px;">
        <p>Add cards to this deck before starting Quiz Mode.</p>
        <button type="button" class="btn btn-primary" data-action="exit-deck-subview">Back</button>
      </div>
    `;
  }

  if (fc.currentIndex >= queue.length) {
    const correctCount = fc.quizAnswers.filter(a => a.correct).length;
    const pct = Math.round((correctCount / queue.length) * 100);
    return `
      <div class="card" style="max-width:680px;margin:0 auto;text-align:center;padding:24px;">
        <span class="badge badge-accent" style="margin-bottom:8px;">QUIZ RESULTS</span>
        <h2 style="margin:0 0 8px;font-size:26px;">Accuracy: ${pct}% (${correctCount} / ${queue.length})</h2>
        <p style="margin:0 0 20px;color:var(--text-secondary);">All quiz responses have been logged to your spaced-repetition review history.</p>
        <div style="text-align:left;display:flex;flex-direction:column;gap:8px;margin-bottom:20px;">
          ${fc.quizAnswers.map(ans => `
            <div class="card-elevated" style="border-left:4px solid ${ans.correct ? 'var(--success)' : 'var(--danger)'};">
              <div style="font-weight:600;">Q: ${escapeHtml(ans.question)}</div>
              <div style="font-size:12px;color:var(--text-secondary);">Your answer: ${escapeHtml(ans.userAnswer)} • Expected: <strong>${escapeHtml(ans.expectedAnswer)}</strong></div>
            </div>
          `).join('')}
        </div>
        <button type="button" class="btn btn-primary" data-action="exit-deck-subview">Done</button>
      </div>
    `;
  }

  const currentCard = queue[fc.currentIndex];
  return `
    <div class="card" style="max-width:680px;margin:0 auto;">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
        <button type="button" class="btn btn-ghost btn-sm" data-action="exit-deck-subview">${getIcon('arrowLeft')} Quit Quiz</button>
        <span class="badge badge-accent">Question ${fc.currentIndex + 1} of ${queue.length}</span>
      </div>
      <h3 style="margin:0 0 16px;font-size:18px;">${escapeHtml(currentCard.question)}</h3>
      <form id="quiz-answer-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="quiz-response-input">Type your answer to check recall (requires exact match or at least 60% of answer keywords):</label>
          <input id="quiz-response-input" name="userAnswer" type="text" class="input" placeholder="Enter your answer..." required autocomplete="off" />
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;">
          <button type="submit" class="btn btn-primary">Submit Answer</button>
        </div>
      </form>
    </div>
  `;
}

// -----------------------------------------------------------------------------
// 7. NOTES & STUDY MATERIALS VIEW
// -----------------------------------------------------------------------------
function renderNotesView() {
  const nw = App.ui.notes;
  const allNotes = (App.state.notes || [])
    .slice()
    .sort((a, b) => String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')));

  const filteredNotes = allNotes.filter(n => {
    if (nw.subjectId !== 'all' && n.subjectId !== nw.subjectId) return false;
    if (nw.search && !`${n.title} ${n.content}`.toLowerCase().includes(nw.search.toLowerCase())) return false;
    return true;
  });

  if (!nw.selectedNoteId && filteredNotes.length > 0) {
    nw.selectedNoteId = filteredNotes[0].id;
  }
  const activeNote = allNotes.find(n => n.id === nw.selectedNoteId) || null;

  return `
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px;">
        <div>
          <h1 style="margin:0 0 4px;font-size:22px;font-weight:700;">Notes & Study Materials</h1>
          <p style="margin:0;color:var(--text-secondary);">Rich Markdown workspace with automatic saving and study file attachment inspection.</p>
        </div>
        <button type="button" class="btn btn-primary" data-action="create-new-note">
          ${getIcon('plus')} New Note
        </button>
      </div>

      <div class="workspace-split-notes">
        <!-- Left Sidebar: Note Search & List -->
        <div class="card" style="padding:14px;">
          <div class="form-group" style="margin-bottom:10px;">
            <input id="notes-search-input" type="text" class="input" placeholder="Search title or content..." value="${escapeHtml(nw.search)}" aria-label="Search notes" />
          </div>
          <div class="form-group" style="margin-bottom:12px;">
            <select id="notes-subject-filter" class="select" aria-label="Filter notes by subject">
              <option value="all">All Subjects</option>
              ${(App.state.subjects || []).map(s => `<option value="${escapeHtml(s.id)}" ${nw.subjectId === s.id ? 'selected' : ''}>${escapeHtml(s.name)}</option>`).join('')}
            </select>
          </div>

          ${filteredNotes.length === 0 ? `
            <div style="padding:20px;text-align:center;color:var(--text-muted);">
              No notes match your search.
            </div>
          ` : `
            <div style="display:flex;flex-direction:column;gap:8px;max-height:520px;overflow-y:auto;">
              ${filteredNotes.map(n => `
                <div class="card-elevated card-interactive" data-action="select-note" data-note-id="${escapeHtml(n.id)}" style="${activeNote && activeNote.id === n.id ? 'border-color:var(--accent);background:var(--accent-soft);' : ''}">
                  <div style="font-weight:600;margin-bottom:4px;">${escapeHtml(n.title || 'Untitled Note')}</div>
                  <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--text-secondary);">
                    ${renderSubjectBadge(n.subjectId)}
                    <span>${escapeHtml(String(n.updatedAt || '').slice(0, 10))}</span>
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        </div>

        <!-- Right Workspace: Note Editor & Preview -->
        <div class="card">
          ${!activeNote ? `
            <div style="text-align:center;padding:48px 20px;color:var(--text-muted);">
              <h3 style="margin:0 0 8px;color:var(--text-primary);">No note selected</h3>
              <p style="margin:0 0 16px;">Select a note from the list or create a new study note.</p>
              <button type="button" class="btn btn-primary" data-action="create-new-note">${getIcon('plus')} Create Note</button>
            </div>
          ` : `
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border-subtle);">
              <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0;flex-wrap:wrap;">
                <input id="active-note-title" type="text" class="input" style="font-weight:700;font-size:16px;flex:1;min-width:140px;" value="${escapeHtml(activeNote.title)}" aria-label="Note Title" />
                <select id="active-note-subject" class="select" style="width:auto;max-width:100%;" aria-label="Note Subject">
                  <option value="">General</option>
                  ${(App.state.subjects || []).map(s => `<option value="${escapeHtml(s.id)}" ${activeNote.subjectId === s.id ? 'selected' : ''}>${escapeHtml(s.name)}</option>`).join('')}
                </select>
              </div>
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <span id="note-autosave-indicator" class="badge ${App.ui.storageError && App.ui.diskSync.permissionState !== 'granted' ? 'badge-danger' : 'badge-success'}">
                  ${escapeHtml(App.ui.storageError && App.ui.diskSync.permissionState !== 'granted' ? 'Not Saved' : (nw.saveStatus || 'Saved'))}
                </span>
                <button type="button" class="btn btn-danger btn-sm" data-action="delete-note" data-note-id="${escapeHtml(activeNote.id)}">${getIcon('trash')} Delete</button>
              </div>
            </div>

            <!-- Formatting Toolbar -->
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
              <div style="display:flex;gap:4px;flex-wrap:wrap;">
                <button type="button" class="btn btn-secondary btn-sm" data-action="note-format" data-snippet="# ">H1</button>
                <button type="button" class="btn btn-secondary btn-sm" data-action="note-format" data-snippet="## ">H2</button>
                <button type="button" class="btn btn-secondary btn-sm" data-action="note-format" data-snippet="**bold** ">Bold</button>
                <button type="button" class="btn btn-secondary btn-sm" data-action="note-format" data-snippet="- ">Bullet</button>
                <button type="button" class="btn btn-secondary btn-sm" data-action="note-format" data-snippet="- [ ] ">Checklist</button>
                <button type="button" class="btn btn-secondary btn-sm" data-action="note-format" data-snippet="> ">Callout</button>
              </div>
              <div class="tabs-bar">
                <button type="button" class="tab-btn ${nw.editorMode === 'edit' ? 'active' : ''}" data-action="set-note-editor-mode" data-mode="edit">Editor</button>
                <button type="button" class="tab-btn ${nw.editorMode === 'split' ? 'active' : ''}" data-action="set-note-editor-mode" data-mode="split">Split</button>
                <button type="button" class="tab-btn ${nw.editorMode === 'preview' ? 'active' : ''}" data-action="set-note-editor-mode" data-mode="preview">Preview</button>
              </div>
            </div>

            <div class="${nw.editorMode === 'split' ? 'grid-2' : ''}" style="margin-bottom:16px;">
              ${nw.editorMode !== 'preview' ? `
                <div>
                  <textarea id="active-note-content" class="textarea" style="min-height:320px;font-family:monospace;font-size:13px;" placeholder="Write structured study notes in Markdown...">${escapeHtml(activeNote.content)}</textarea>
                </div>
              ` : ''}
              ${nw.editorMode !== 'edit' ? `
                <div id="active-note-preview" class="card-elevated" style="min-height:320px;max-height:460px;overflow-y:auto;">
                  ${renderMarkdownSafe(activeNote.content)}
                </div>
              ` : ''}
            </div>

            <!-- Study Material Attachment Section -->
            <div class="card-elevated">

// 8. EXAM TRACKER VIEW
// -----------------------------------------------------------------------------
function renderExamsView(stats) {
  const prefs = App.state.preferences || {};
  const allExams = (App.state.exams || []).slice().sort((a, b) => String(a.examDate).localeCompare(String(b.examDate)));

  return `
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;">
        <div>
          <h1 style="margin:0 0 4px;font-size:22px;font-weight:700;">Exam Tracker & Readiness</h1>
          <p style="margin:0;color:var(--text-secondary);">Timezone-verified exam countdowns (${escapeHtml(prefs.timezone || 'UTC')}), syllabus readiness, and remaining revision estimates.</p>
        </div>
        <button type="button" class="btn btn-primary" data-action="open-exam-modal">
          ${getIcon('plus')} Add Exam
        </button>
      </div>

      ${allExams.length === 0 ? `
        <div class="card" style="text-align:center;padding:40px 20px;">
          <h3 style="margin:0 0 8px;">No exams tracked yet</h3>
          <p style="margin:0 0 16px;color:var(--text-secondary);">Add upcoming midterms, finals, or quizzes to monitor chapter completion and revision countdowns.</p>
          <button type="button" class="btn btn-primary" data-action="open-exam-modal">${getIcon('plus')} Add First Exam</button>
        </div>
      ` : `
        <div class="grid-2">
          ${allExams.map(ex => {
            const cd = getExamCountdown(ex.examDate, ex.examTime, prefs.timezone);
            const subChapters = (App.state.chapters || []).filter(c => c.subjectId === ex.subjectId);
            const relevantChapters = (ex.chapterIds && ex.chapterIds.length > 0)
              ? subChapters.filter(c => ex.chapterIds.includes(c.id))
              : subChapters;
            const doneCh = relevantChapters.filter(c => c.status === 'completed').length;
            const chPct = relevantChapters.length > 0 ? Math.round((doneCh / relevantChapters.length) * 100) : 0;

            const prepTasks = (App.state.tasks || []).filter(t => t.subjectId === ex.subjectId && !t.completed);
            const estRemainingMin = prepTasks.reduce((acc, t) => acc + Number(t.estimatedMinutes || 45), 0);
            const needsAttention = !cd.isPast && cd.days <= 14 && (chPct < 100 || prepTasks.length > 0) && ex.status !== 'completed';

            return `
              <div class="card" style="border-left:4px solid ${cd.isPast || ex.status === 'completed' ? 'var(--success)' : needsAttention ? 'var(--danger)' : 'var(--accent)'};">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:8px;">
                  <div>
                    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;">
                      <h3 style="margin:0;font-size:17px;font-weight:700;">${escapeHtml(ex.name)}</h3>
                      ${renderSubjectBadge(ex.subjectId)}
                      ${needsAttention ? '<span class="badge badge-danger">Needs Attention</span>' : ''}
                    </div>
                    <div style="font-size:12px;color:var(--text-secondary);">
                      Date: <strong>${escapeHtml(ex.examDate)}</strong> at <strong>${escapeHtml(ex.examTime || '09:00')}</strong>
                    </div>
                  </div>
                  <span class="badge ${cd.isPast ? 'badge-neutral' : cd.urgent ? 'badge-danger' : 'badge-warning'}">
                    ${escapeHtml(cd.label)}
                  </span>
                </div>

                ${ex.description ? `<p style="margin:0 0 10px;font-size:13px;color:var(--text-secondary);">${escapeHtml(ex.description)}</p>` : ''}

                <div style="margin-bottom:12px;">
                  <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;">
                    <span>Relevant Chapter Readiness (${doneCh}/${relevantChapters.length})</span>
                    <strong>${chPct}%</strong>
                  </div>
                  <div class="progress-track">
                    <div class="progress-fill" style="width:${chPct}%;background:${chPct === 100 ? 'var(--success)' : 'var(--accent)'};"></div>
                  </div>
                </div>

                <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary);margin-bottom:12px;">
                  <span>Open Prep Tasks: <strong>${prepTasks.length}</strong></span>
                  <span>Est. Remaining Revision: <strong>${formatDuration(estRemainingMin)}</strong></span>
                  <span>Status: <strong>${escapeHtml(ex.status)}</strong></span>
                </div>

                ${ex.notes ? `<div class="card-elevated" style="font-size:12px;margin-bottom:12px;"><strong>Exam Notes:</strong> ${escapeHtml(ex.notes)}</div>` : ''}

                <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--border-subtle);">
                  <div style="display:flex;gap:6px;">
                    <button type="button" class="btn btn-secondary btn-sm" data-action="toggle-exam-complete" data-exam-id="${escapeHtml(ex.id)}">
                      ${ex.status === 'completed' ? 'Reopen Exam' : 'Mark Completed'}
                    </button>
                  </div>
                  <div style="display:flex;gap:6px;">
                    <button type="button" class="btn btn-ghost btn-sm" data-action="edit-exam" data-exam-id="${escapeHtml(ex.id)}">${getIcon('edit')}</button>
                    <button type="button" class="btn btn-danger btn-sm" data-action="delete-exam" data-exam-id="${escapeHtml(ex.id)}">${getIcon('trash')}</button>
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `}
    </div>
  `;
}

const DISK_DB_NAME = 'studyos_disk_sync_db';
const DISK_STORE_NAME = 'file_handles';
const DISK_HANDLE_KEY = 'linked_workspace_handle';

const DiskSyncManager = {
  openDb() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) {
        reject(new Error('IndexedDB is not supported in this browser.'));
        return;
      }
      const req = window.indexedDB.open(DISK_DB_NAME, 1);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(DISK_STORE_NAME)) {
          db.createObjectStore(DISK_STORE_NAME);
        }
      };
      req.onsuccess = e => resolve(e.target.result);
      req.onerror = () => reject(req.error || new Error('Failed to open IndexedDB.'));
    });
  },

  async saveHandle(handle) {
    try {
      const db = await this.openDb();
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(DISK_STORE_NAME, 'readwrite');
        const store = tx.objectStore(DISK_STORE_NAME);
        store.put(handle, DISK_HANDLE_KEY);
        tx.oncomplete = () => { db.close(); resolve(true); };
        tx.onerror = () => { db.close(); reject(tx.error || new Error('IndexedDB write failed.')); };
      });
    } catch (err) {
      return false;
    }
  },

  async loadHandle() {
    try {
      const db = await this.openDb();
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(DISK_STORE_NAME, 'readonly');
        const store = tx.objectStore(DISK_STORE_NAME);
        const getReq = store.get(DISK_HANDLE_KEY);
        getReq.onsuccess = () => { db.close(); resolve(getReq.result || null); };
        getReq.onerror = () => { db.close(); reject(getReq.error); };
      });
    } catch (err) {
      return null;
    }
  },

  async clearHandle() {
    try {
      const db = await this.openDb();
      return await new Promise(resolve => {
        const tx = db.transaction(DISK_STORE_NAME, 'readwrite');
        tx.objectStore(DISK_STORE_NAME).delete(DISK_HANDLE_KEY);
        tx.oncomplete = () => { db.close(); resolve(true); };
        tx.onerror = () => { db.close(); resolve(false); };
      });
    } catch (err) {
      return false;
    }
  }
};

function showToast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  if (!container) return;
  while (container.children.length >= 1) {
    container.firstChild.remove();
  }
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  toast.innerHTML = `
    <span>${escapeHtml(message)}</span>
    <button type="button" class="btn btn-ghost btn-sm" style="padding:2px 6px;" aria-label="Dismiss notification">×</button>
  `;
  toast.querySelector('button').addEventListener('click', () => toast.remove());
  container.appendChild(toast);
  setTimeout(() => {
    if (toast.parentNode) toast.remove();
  }, 4200);
}

// -----------------------------------------------------------------------------
// TEMPLATE-BASED LOCAL STUDY TOOLS ENGINE (NO AI MODEL, FILL-IN-THE-BLANK)
// -----------------------------------------------------------------------------
function buildClozeFromSentence(sentence, index) {
  const cleaned = sentence.replace(/^[#*\->\s0-9.]+/, '').trim();
  const stopwords = new Set([
    'the', 'and', 'for', 'with', 'that', 'this', 'from', 'into', 'are', 'was',
    'were', 'have', 'has', 'had', 'not', 'but', 'what', 'which', 'when', 'where',
    'who', 'why', 'how', 'can', 'will', 'should', 'would', 'could', 'their',
    'there', 'these', 'those', 'while', 'through', 'between', 'because'
  ]);
  const words = cleaned.split(/\s+/);
  // Pick a meaningful content word (>= 4 letters, not a stopword)
  let targetWord = '';
  let targetIdx = -1;
  for (let i = 0; i < words.length; i++) {
    const bare = words[i].replace(/[^a-zA-Z0-9_-]/g, '');
    if (bare.length >= 5 && !stopwords.has(bare.toLowerCase())) {
      targetWord = bare;
      targetIdx = i;
      break;
    }
  }
  if (targetIdx === -1) {
    for (let i = 0; i < words.length; i++) {
      const bare = words[i].replace(/[^a-zA-Z0-9_-]/g, '');
      if (bare.length >= 3 && !stopwords.has(bare.toLowerCase())) {
        targetWord = bare;
        targetIdx = i;
        break;
      }
    }
  }
  if (targetIdx === -1 || !targetWord) {
    return {
      prompt: `Fill in the missing concept (#${index + 1}): ________`,
      answer: cleaned
    };
  }
  const blankedWords = words.slice();
  blankedWords[targetIdx] = words[targetIdx].replace(targetWord, '________');
  return {
    prompt: blankedWords.join(' '),
    answer: targetWord
  };
}

function runLocalAiAssistant(tool, noteId, promptText) {
  const stats = computeAnalytics(App.state);
  const note = noteId ? (App.state.notes || []).find(n => n.id === noteId) : null;
  const attachmentText = note && Array.isArray(note.attachments)
    ? note.attachments.map(a => a.extractedText || '').filter(Boolean).join('\n')
    : '';
  const sourceMaterial = [note ? note.content : '', attachmentText, promptText].filter(Boolean).join('\n\n').trim();
  const lines = sourceMaterial.split('\n').map(l => l.replace(/^[#*\->\s0-9.]+/, '').trim()).filter(l => l.length > 10);

  App.ui.assistant.lastGeneratedCards = [];

  if (tool === 'priorities') {
    const overdueList = stats.overdueTasks.map(t => `- **Overdue Task**: "${t.title}" (Due ${t.dueDate}, ${t.priority.toUpperCase()} priority)`).join('\n');
    const dueTodayList = stats.tasksDueToday.map(t => `- **Due Today**: "${t.title}" (${t.estimatedMinutes || 45}m estimated)`).join('\n');
    const weakSubjects = stats.subjectBreakdown
      .slice()
      .sort((a, b) => a.progressPct - b.progressPct)
      .map(s => `- **${s.subject.name}**: ${s.progressPct}% syllabus completion (${formatDuration(s.studyMinutes)} logged)`)
      .join('\n');

    return {
      promptSummary: 'Revision Priorities & Weak Subjects',
      responseMarkdown: [
        '# Data-Grounded Revision Priority Plan',
        overdueList ? `## 1. Immediate Overdue Recovery\n${overdueList}` : '## 1. Overdue Check\n- No overdue tasks found—great job staying current.',
        dueTodayList ? `## 2. Tasks Due Today\n${dueTodayList}` : '## 2. Today’s Deadlines\n- No tasks strictly due today.',
        weakSubjects ? `## 3. Subject Progress Ranking (Lowest to Highest)\n${weakSubjects}` : '## 3. Subject Progress\n- Add subjects and chapters to compare subject completion.',
        `## 4. Spaced Repetition & Focus Target\n- Flashcards due for review today: **${stats.dueCardsCount} card(s)** (${stats.difficultCardsCount} marked difficult)\n- Today's focus progress: **${formatDuration(stats.studyMinutesToday)} / ${formatDuration(stats.dailyGoal)}**`
      ].join('\n\n')
    };
  }

  if (!sourceMaterial) {
    return {
      promptSummary: `${tool.toUpperCase()} Tool`,
      responseMarkdown: 'Please select a saved note with content or enter study text in the text box so the local template tool has material to process.'
    };
  }

  if (tool === 'summarize') {
    const topBullets = lines.slice(0, 6).map(l => `- ${l}`).join('\n');
    return {
      promptSummary: `Summarize ${note ? `"${note.title}"` : 'Provided Text'}`,
      responseMarkdown: [
        `# Extracted Study Summary${note ? `: ${note.title}` : ''}`,
        '> Extracted directly from your supplied study text.',
        '## Key Sentences & Takeaways',
        topBullets || `- ${sourceMaterial.slice(0, 240)}`,
        `## Revision Checklist\n- [ ] Review key statements above\n- [ ] Test recall without looking at the source note`
      ].join('\n\n')
    };
  }

  if (tool === 'flashcards') {
    const generated = (lines.length > 0 ? lines : [sourceMaterial]).slice(0, 5).map((line, idx) => {
      const colonIdx = line.indexOf(':');
      if (colonIdx > 2 && colonIdx < 80) {
        return {
          question: `Define or explain: ${line.slice(0, colonIdx).trim()}`,
          answer: line.slice(colonIdx + 1).trim(),
          explanation: note ? `Extracted from note "${note.title}"` : 'Extracted from supplied study text'
        };
      }
      const cloze = buildClozeFromSentence(line, idx);
      return {
        question: `Fill in the blank: ${cloze.prompt}`,
        answer: cloze.answer,
        explanation: `Full statement: ${line}`
      };
    });
    App.ui.assistant.lastGeneratedCards = generated;

    const mdCards = generated.map((c, i) => `${i + 1}. **Q:** ${c.question}\n   - **A:** ${c.answer}`).join('\n');
    return {
      promptSummary: `Extract Flashcards from ${note ? `"${note.title}"` : 'Supplied Material'}`,
      responseMarkdown: `# Extracted Flashcards (${generated.length})\nClick **"Save Cards to Flashcard Deck"** above to add these directly into your active recall decks:\n\n${mdCards}`
    };
  }

  if (tool === 'fill_blank' || tool === 'mcq') {
    const items = (lines.length > 0 ? lines : [sourceMaterial]).slice(0, 5);
    const clozes = items.map((line, idx) => {
      const cloze = buildClozeFromSentence(line, idx);
      return [
        `### Question ${idx + 1} (Fill in the Blank)`,
        `${cloze.prompt}`,
        `> **Answer:** ${cloze.answer} *(Source: "${line}")*`
      ].join('\n');
    }).join('\n\n');

    return {
      promptSummary: `Fill-in-the-Blank Practice for ${note ? `"${note.title}"` : 'Provided Text'}`,
      responseMarkdown: `# Fill-in-the-Blank Practice Questions\n\n${clozes}`
    };
  }

  // explain / outline
  return {
    promptSummary: `Concept Outline: ${promptText || (note ? note.title : 'Study Text')}`,
    responseMarkdown: [
      `# Structured Outline: ${promptText || (note ? note.title : 'Study Topic')}`,
      '## 1. Primary Statement',
      lines[0] ? `- ${lines[0]}` : `- ${sourceMaterial.slice(0, 200)}`,
      '## 2. Supporting Points from Text',
      lines.slice(1, 6).map(l => `- ${l}`).join('\n') || '- Review the key definitions and formulas in your note.',
      '## 3. Self-Check Prompt',
      '- Write down the main terms from memory, then compare against the source note.'
    ].join('\n\n')
  };
}
