// QUIZ GRADING HELPER (HIGH #5)
// -----------------------------------------------------------------------------
function gradeQuizResponse(userRaw, expectedRaw) {
  const cleanUser = String(userRaw || '')
    .toLowerCase()
    .replace(/[^\w\s]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
  const cleanExpected = String(expectedRaw || '')
    .toLowerCase()
    .replace(/[^\w\s]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();

  // Reject empty or 1-character answers (unless expected answer itself is that exact 1 character)
  if (!cleanUser) return false;
  if (cleanUser === cleanExpected) return true;
  if (cleanUser.length < 2) return false;

  const stopwords = new Set([
    'the', 'and', 'for', 'with', 'that', 'this', 'from', 'into', 'are', 'was',
    'were', 'have', 'has', 'had', 'not', 'but', 'what', 'which', 'when', 'where',
    'who', 'why', 'how', 'onto', 'upon', 'through', 'between'
  ]);

  let expectedKeywords = cleanExpected.split(' ').filter(w => w.length >= 2 && !stopwords.has(w));
  if (expectedKeywords.length === 0) {
    expectedKeywords = cleanExpected.split(' ').filter(Boolean);
  }
  if (expectedKeywords.length === 0) return false;

  const userWords = cleanUser.split(' ').filter(Boolean);
  const userWordSet = new Set(userWords);

  let matchedCount = 0;
  expectedKeywords.forEach(kw => {
    if (userWordSet.has(kw)) {
      matchedCount += 1;
    } else if (kw.length >= 5) {
      // Allow close stem match only when user token is at least 4 characters long
      const stemHit = userWords.some(uw => uw.length >= 4 && (kw.startsWith(uw) || uw.startsWith(kw)));
      if (stemHit) matchedCount += 1;
    }
  });

  const ratio = matchedCount / expectedKeywords.length;
  return ratio >= 0.6;
}

// -----------------------------------------------------------------------------
// DISK SYNC CONTROLLERS (MEDIUM #14 & PWA #4-5)
// -----------------------------------------------------------------------------
function updateDiskStatusDom() {
  const ds = App.ui.diskSync;
  const titlebarStatusEl = document.getElementById('win-disk-status-label');
  const sidebarStorageEl = document.getElementById('sidebar-storage-status');
  const errorBannerEl = document.getElementById('storage-error-banner');
  const reconnectBannerEl = document.getElementById('disk-reconnect-banner');

  const isDiskSaving = ds.permissionState === 'granted' && Boolean(ds.handle) && !ds.writeError;
  const isSavingFailing = App.ui.storageError && !isDiskSaving;

  if (errorBannerEl) {
    errorBannerEl.style.display = isSavingFailing ? 'flex' : 'none';
  }

  if (reconnectBannerEl) {
    if (ds.fileName && ds.permissionState === 'prompt') {
      reconnectBannerEl.style.display = 'flex';
      const nameSpan = document.getElementById('disk-reconnect-filename');
      if (nameSpan) nameSpan.textContent = ds.fileName;
    } else {
      reconnectBannerEl.style.display = 'none';
    }
  }

  if (sidebarStorageEl) {
    if (isSavingFailing) {
      sidebarStorageEl.textContent = 'Storage Blocked — Not Saving';
      sidebarStorageEl.style.color = 'var(--danger)';
      sidebarStorageEl.style.fontWeight = '700';
    } else if (isDiskSaving) {
      sidebarStorageEl.textContent = `Disk Sync: ${ds.fileName}`;
      sidebarStorageEl.style.color = 'var(--success)';
      sidebarStorageEl.style.fontWeight = '600';
    } else {
      sidebarStorageEl.textContent = 'Local Persisted Storage';
      sidebarStorageEl.style.color = '';
      sidebarStorageEl.style.fontWeight = '';
    }
  }

  if (titlebarStatusEl) {
    if (ds.writeError) {
      titlebarStatusEl.textContent = `Disk Write Failed (${ds.fileName || 'File'})`;
      titlebarStatusEl.style.color = 'var(--danger)';
    } else if (isDiskSaving) {
      titlebarStatusEl.textContent = `Linked: ${ds.fileName}`;
      titlebarStatusEl.style.color = 'var(--success)';
    } else if (ds.fileName && ds.permissionState === 'prompt') {
      titlebarStatusEl.textContent = `Remembered: ${ds.fileName} (Reconnect)`;
      titlebarStatusEl.style.color = 'var(--warning)';
    } else if (isSavingFailing) {
      titlebarStatusEl.textContent = 'Storage Blocked';
      titlebarStatusEl.style.color = 'var(--danger)';
    } else {
      titlebarStatusEl.textContent = 'Local Storage Ready';
      titlebarStatusEl.style.color = 'var(--text-muted)';
    }
  }
}

async function writeStateToHandle(handle) {
  if (!handle) return { ok: false, error: 'No disk file handle linked.' };
  try {
    const writable = await handle.createWritable();
    await writable.write(JSON.stringify(App.state, null, 2));
    await writable.close();
    App.ui.diskSync.writeError = '';
    App.ui.diskSync.permissionState = 'granted';
    updateDiskStatusDom();
    return { ok: true };
  } catch (err) {
    const msg = (err && err.message) ? err.message : 'Unable to write to linked disk file.';
    App.ui.diskSync.writeError = msg;
    updateDiskStatusDom();
    showToast(`Disk write error: ${msg}`, 'danger');
    return { ok: false, error: msg };
  }
}

async function connectOrSaveWindowsDiskFile() {
  const dataStr = JSON.stringify(App.state, null, 2);
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: App.ui.diskSync.fileName || 'StudyOS-Workspace.json',
        types: [{ description: 'StudyOS JSON File', accept: { 'application/json': ['.json'] } }]
      });
      App.ui.diskSync.handle = handle;
      App.ui.diskSync.fileName = handle.name || 'StudyOS-Workspace.json';
      await DiskSyncManager.saveHandle(handle);
      const writeRes = await writeStateToHandle(handle);
      renderApp();
      if (writeRes.ok) {
        showToast(`Linked and saved directly to "${App.ui.diskSync.fileName}"!`, 'success');
      }
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') return;
      const msg = (err && err.message) ? err.message : 'Disk file save failed.';
      App.ui.diskSync.writeError = msg;
      updateDiskStatusDom();
      showToast(`Disk sync failed: ${msg}`, 'danger');
      return;
    }
  }
  // Fallback JSON export when File System Access API is unavailable
  exportWorkspaceJsonBackup();
}

async function autoSyncToConnectedWindowsFile() {
  const handle = App.ui.diskSync.handle;
  if (!handle || App.ui.diskSync.permissionState !== 'granted') return { ok: false };
  return await writeStateToHandle(handle);
}

async function readAndApplyHandleContent(handle) {
  const file = await handle.getFile();
  const rawText = await file.text();
  const trimmed = (rawText || '').trim();
  if (!trimmed || trimmed === '{}') {
    // Empty or brand-new JSON file: do not error; initialize the file with current state
    await writeStateToHandle(handle);
    return { initializedEmpty: true };
  }
  const parsed = JSON.parse(trimmed);
  App.state = validateAndNormalizeState(parsed);
  return { initializedEmpty: false };
}

async function openWindowsDiskFile() {
  if (window.showOpenFilePicker) {
    try {
      const [handle] = await window.showOpenFilePicker({
        types: [{ description: 'StudyOS JSON File', accept: { 'application/json': ['.json'] } }]
      });
      if (!handle) return;
      App.ui.diskSync.handle = handle;
      App.ui.diskSync.fileName = handle.name || 'StudyOS-Workspace.json';
      App.ui.diskSync.permissionState = 'granted';
      App.ui.diskSync.writeError = '';
      await DiskSyncManager.saveHandle(handle);

      const loadInfo = await readAndApplyHandleContent(handle);
      App.ui.modal = null;
      const localRes = StudyOSStorage.saveState(App.state);
      App.ui.storageError = !localRes.ok;
      renderApp();
      if (loadInfo.initializedEmpty) {
        showToast(`Linked empty/new file "${App.ui.diskSync.fileName}" and initialized workspace!`, 'success');
      } else {
        showToast(`Loaded and linked "${App.ui.diskSync.fileName}"!`, 'success');
      }
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') return;
      const msg = (err && err.message) ? err.message : 'Failed to open JSON file.';
      App.ui.diskSync.writeError = msg;
      updateDiskStatusDom();
      showToast(`Error opening disk file: ${msg}`, 'danger');
      return;
    }
  }
  const imp = document.getElementById('import-json-input');
  if (imp) imp.click();
}

async function reconnectRememberedDiskFile() {
  const handle = App.ui.diskSync.handle;
  if (!handle) return;
  try {
    let perm = 'granted';
    if (typeof handle.requestPermission === 'function') {
      perm = await handle.requestPermission({ mode: 'readwrite' });
    }
    if (perm !== 'granted') {
      App.ui.diskSync.permissionState = 'prompt';
      updateDiskStatusDom();
      showToast('Permission to access the linked file was not granted.', 'warning');
      return;
    }
    App.ui.diskSync.permissionState = 'granted';
    App.ui.diskSync.writeError = '';
    const loadInfo = await readAndApplyHandleContent(handle);
    const localRes = StudyOSStorage.saveState(App.state);
    App.ui.storageError = !localRes.ok;
    renderApp();
    showToast(
      loadInfo.initializedEmpty
        ? `Reconnected to "${App.ui.diskSync.fileName}" and synced workspace!`
        : `Reconnected and loaded "${App.ui.diskSync.fileName}"!`,
      'success'
    );
  } catch (err) {
    const msg = (err && err.message) ? err.message : 'Failed to reconnect disk file.';
    App.ui.diskSync.writeError = msg;
    updateDiskStatusDom();
    showToast(`Failed to reconnect file: ${msg}`, 'danger');
  }
}

async function restoreRememberedDiskHandleOnBoot() {
  const savedHandle = await DiskSyncManager.loadHandle();
  if (!savedHandle) return;
  App.ui.diskSync.handle = savedHandle;
  App.ui.diskSync.fileName = savedHandle.name || 'StudyOS-Workspace.json';
  try {
    let perm = 'prompt';
    if (typeof savedHandle.queryPermission === 'function') {
      perm = await savedHandle.queryPermission({ mode: 'readwrite' });
    }
    App.ui.diskSync.permissionState = perm === 'granted' ? 'granted' : 'prompt';
    if (perm === 'granted') {
      await readAndApplyHandleContent(savedHandle);
    }
  } catch (e) {
    App.ui.diskSync.permissionState = 'prompt';
  }
  renderApp();
}

function exportWorkspaceJsonBackup() {
  const dataStr = JSON.stringify(App.state, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `studyos-backup-${getLocalDateString()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('Exported workspace JSON backup.', 'success');
}

// -----------------------------------------------------------------------------
// TIMER LIFECYCLE & EXPIRED SESSION HANDLING (HIGH #6 & HIGH #7)
// -----------------------------------------------------------------------------
function getSessionStartMs(t, fallbackElapsedSec) {
  if (t.sessionStartedIso) {
    const parsed = Date.parse(t.sessionStartedIso);
    if (!isNaN(parsed)) return parsed;
  }
  if (t.startedAtEpochMs) {
    return t.startedAtEpochMs - Number(t.accumulatedElapsedMs || 0);
  }
  return Date.now() - fallbackElapsedSec * 1000;
}

function handleExpiredTimerOnRestore(savedTimer) {
  const t = { ...App.ui.timer, ...savedTimer, intervalHandle: null };
  let elapsedMs = Number(t.accumulatedElapsedMs || 0);
  if (t.status === 'running' && t.startedAtEpochMs) {
    elapsedMs += Math.max(0, Date.now() - t.startedAtEpochMs);
  }
  const elapsedSec = Math.floor(elapsedMs / 1000);
  const targetSec = Math.max(60, Number(t.targetDurationSec || 1500));

  if (elapsedSec >= targetSec) {
    // Timer expired while app was closed/reopened -> log with endTime = startedAt + target and mark 'needs_review'
    const startMs = getSessionStartMs(t, elapsedSec);
    const exactEndIso = new Date(startMs + targetSec * 1000).toISOString();
    const plannedMinutes = Math.max(1, Math.round(targetSec / 60));
    const sessionId = t.sessionId || generateId('focus');
    const alreadyExists = (App.state.focusSessions || []).some(s => s.id === sessionId);

    if (!alreadyExists && t.mode === 'focus') {
      App.state.focusSessions.push({
        id: sessionId,
        subjectId: t.subjectId || null,
        taskId: t.taskId || null,
        mode: 'focus',
        startTime: new Date(startMs).toISOString(),
        endTime: exactEndIso,
        plannedMinutes,
        durationMinutes: plannedMinutes,
        status: 'needs_review'
      });
    }

    App.ui.timer.status = 'idle';
    App.ui.timer.startedAtEpochMs = null;
    App.ui.timer.accumulatedElapsedMs = 0;
    App.ui.timer.sessionStartedIso = null;
    App.ui.timer.sessionId = null;
    StudyOSStorage.saveTimerState(null);
    StudyOSStorage.saveState(App.state);
    autoSyncToConnectedWindowsFile();
    setTimeout(() => {
      showToast('Previous timer expired while away. Marked "Needs Review" (not counted until confirmed).', 'warning');
    }, 100);
    return true;
  }
  return false;
}

function syncTimerLoop() {
  if (App.ui.timer.intervalHandle) {
    clearInterval(App.ui.timer.intervalHandle);
    App.ui.timer.intervalHandle = null;
  }
  StudyOSStorage.saveTimerState({
    mode: App.ui.timer.mode,
    status: App.ui.timer.status,
    targetDurationSec: App.ui.timer.targetDurationSec,
    startedAtEpochMs: App.ui.timer.startedAtEpochMs,
    accumulatedElapsedMs: App.ui.timer.accumulatedElapsedMs,
    sessionStartedIso: App.ui.timer.sessionStartedIso,
    sessionId: App.ui.timer.sessionId,
    subjectId: App.ui.timer.subjectId,
    taskId: App.ui.timer.taskId
  });

  if (App.ui.timer.status === 'running') {
    App.ui.timer.intervalHandle = setInterval(() => {
      const elapsedSec = getTimerElapsedSeconds();
      const remSec = Math.max(0, App.ui.timer.targetDurationSec - elapsedSec);
      const clockEl = document.getElementById('timer-clock-display');
      if (clockEl) clockEl.textContent = formatTimerClock(remSec);
      const pillEl = document.getElementById('header-timer-pill');
      if (pillEl && pillEl.style.display !== 'none') {
        pillEl.innerHTML = `${getIcon('timer')} <span>${formatTimerClock(remSec)}</span>`;
      }
      if (remSec <= 0) {
        completeCurrentTimerSession(true);
      }
    }, 500);
  }
}

function completeCurrentTimerSession(autoTriggered = false) {
  const t = App.ui.timer;
  if (t.status === 'idle') return;
  const elapsedSec = getTimerElapsedSeconds();
  const targetSec = Math.max(60, Number(t.targetDurationSec || 1500));

  // HIGH #6: Do NOT log anything under 60 real seconds
  if (elapsedSec < 60) {
    t.status = 'idle';
    t.startedAtEpochMs = null;
    t.accumulatedElapsedMs = 0;
    t.sessionStartedIso = null;
    t.sessionId = null;
    syncTimerLoop();
    renderApp();
    showToast('Sessions under 60 seconds are not logged.', 'warning');
    return;
  }

  const startMs = getSessionStartMs(t, elapsedSec);
  const plannedMinutes = Math.max(1, Math.round(targetSec / 60));
  const actualMinutes = Math.max(1, Number((Math.min(elapsedSec, targetSec) / 60).toFixed(2)));
  const sessionId = t.sessionId || generateId('focus');

  // HIGH #7: If timer expired long ago (e.g., tab woke up > 60s after target), cap endTime to startedAt + target and mark 'needs_review'
  const expiredLongAgo = elapsedSec > targetSec + 60;
  const computedEndTime = (autoTriggered || elapsedSec >= targetSec)
    ? new Date(startMs + targetSec * 1000).toISOString()
    : new Date().toISOString();
  const sessionStatus = expiredLongAgo ? 'needs_review' : 'completed';

  const alreadyExists = (App.state.focusSessions || []).some(s => s.id === sessionId);
  if (!alreadyExists && t.mode === 'focus') {
    App.state.focusSessions.push({
      id: sessionId,
      subjectId: t.subjectId || null,
      taskId: t.taskId || null,
      mode: 'focus',
      startTime: new Date(startMs).toISOString(),
      endTime: computedEndTime,
      plannedMinutes,
      durationMinutes: autoTriggered || elapsedSec >= targetSec ? plannedMinutes : actualMinutes,
      status: sessionStatus
    });
  }

  playCompletionChime(App.state.preferences.soundNotifications);
  const completedMode = t.mode;

  if (App.state.preferences.autoTransitionTimer && !expiredLongAgo) {
    const nextMode = completedMode === 'focus' ? 'short_break' : 'focus';
    const nextDurMin = nextMode === 'focus'
      ? (App.state.preferences.focusDurationMinutes || 25)
      : (App.state.preferences.shortBreakMinutes || 5);
    t.mode = nextMode;
    t.status = 'running';
    t.targetDurationSec = nextDurMin * 60;
    t.startedAtEpochMs = Date.now();
    t.accumulatedElapsedMs = 0;
    t.sessionStartedIso = new Date().toISOString();
    t.sessionId = generateId('focus');
  } else {
    t.status = 'idle';
    t.startedAtEpochMs = null;
    t.accumulatedElapsedMs = 0;
    t.sessionStartedIso = null;
    t.sessionId = null;
  }

  syncTimerLoop();
  const msg = expiredLongAgo
    ? 'Timer expired while inactive. Logged as "Needs Review" with endTime = startedAt + target.'
    : (completedMode === 'focus'
      ? 'Focus session completed and logged to your study analytics!'
      : 'Break finished! Ready for your next focus block.');
  saveAndRender(msg, expiredLongAgo ? 'warning' : 'success');
}

      autoSyncToConnectedWindowsFile();
      updateDiskStatusDom();
      const badge = document.getElementById('note-autosave-indicator');
      const isDiskSaving = App.ui.diskSync.permissionState === 'granted' && Boolean(App.ui.diskSync.handle) && !App.ui.diskSync.writeError;
      if (badge) {
        badge.textContent = (res.ok || isDiskSaving) ? `Autosaved ${new Date().toTimeString().slice(0, 8)}` : 'Save Failed';
        badge.className = `badge ${(res.ok || isDiskSaving) ? 'badge-success' : 'badge-danger'}`;
      }
      const prev = document.getElementById('active-note-preview');
      if (prev) prev.innerHTML = renderMarkdownSafe(activeNote.content);
    };
  }
  if (activeNote && noteSubSelect) {
    noteSubSelect.onchange = e => {
      activeNote.subjectId = e.target.value || null;
      activeNote.updatedAt = new Date().toISOString();
      saveAndRender();
    };
  }

  // Note file attachment input
  const attachInput = document.getElementById('note-attachment-input');
  if (attachInput && activeNote) {
    attachInput.onchange = e => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      if (file.size > 2 * 1024 * 1024) {
        showToast('File exceeds 2MB local attachment limit.', 'danger');
        return;
      }
      const allowedExts = ['.txt', '.md', '.csv', '.json', '.pdf'];
      const lower = file.name.toLowerCase();
      if (!allowedExts.some(ext => lower.endsWith(ext))) {
        showToast('Unsupported file type. Please upload .txt, .md, .csv, .json, or .pdf.', 'danger');
        return;
      }
      if (!Array.isArray(activeNote.attachments)) activeNote.attachments = [];

      if (lower.endsWith('.pdf')) {
        activeNote.attachments.push({
          name: file.name,
          size: file.size,
          type: 'application/pdf',
          uploadedAt: new Date().toISOString(),
          extractedText: ''
        });
        saveAndRender(`Attached "${file.name}" metadata.`, 'info');
      } else {
        const reader = new FileReader();
        reader.onload = ev => {
          const text = String(ev.target.result || '').slice(0, 20000);
          activeNote.attachments.push({
            name: file.name,
            size: file.size,
            type: file.type || 'text/plain',
            uploadedAt: new Date().toISOString(),
            extractedText: text
          });
          saveAndRender(`Attached and extracted text from "${file.name}"!`, 'success');
        };
        reader.onerror = () => showToast('Failed to read attached file.', 'danger');
        reader.readAsText(file);
      }
    };
  }

  // Settings JSON import (supports empty or {} JSON files without error)
  const importInput = document.getElementById('import-json-input');
  if (importInput) {
    importInput.onchange = e => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const raw = String(ev.target.result || '').trim();
          const parsed = raw ? JSON.parse(raw) : {};
          App.state = validateAndNormalizeState(parsed);
          saveAndRender('Workspace backup imported and validated!', 'success');
        } catch (err) {
          showToast('Invalid JSON backup file.', 'danger');
        }
      };
      reader.readAsText(file);
    };
  }
}

function detectStandaloneAppMode() {
  try {
    const isStandaloneMedia = window.matchMedia && (
      window.matchMedia('(display-mode: standalone)').matches ||
      window.matchMedia('(display-mode: window-controls-overlay)').matches ||
      window.matchMedia('(display-mode: minimal-ui)').matches
    );
    const isNavigatorStandalone = Boolean(window.navigator && window.navigator.standalone);
    if (isStandaloneMedia || isNavigatorStandalone) {
      document.body.classList.add('standalone-app-mode');
    }
  } catch (e) {
    // Ignore
  }
}

function initStudyOSApp() {
  detectStandaloneAppMode();
  if (window.__studyos_initialized) {
    App.state = StudyOSStorage.loadState();
    App.ui.storageError = !StudyOSStorage.storageAvailable;
    renderApp();
    return;
  }
  window.__studyos_initialized = true;
  App.state = StudyOSStorage.loadState();
  App.ui.storageError = !StudyOSStorage.storageAvailable;

  // Restore running/paused timer across refreshes (checking HIGH #7 expired timer first)
  const savedTimer = StudyOSStorage.loadTimerState();
  if (savedTimer && savedTimer.status && savedTimer.status !== 'idle') {
    const wasExpired = handleExpiredTimerOnRestore(savedTimer);
    if (!wasExpired) {
      App.ui.timer = { ...App.ui.timer, ...savedTimer, intervalHandle: null };
      syncTimerLoop();
    }
  } else {
    App.ui.timer.targetDurationSec = (App.state.preferences.focusDurationMinutes || 25) * 60;
  }

  // Restore remembered IndexedDB file handle (MEDIUM #14 / PWA #4)
  restoreRememberedDiskHandleOnBoot();

  // Global search input
  const globalSearchInput = document.getElementById('global-search-input');
  if (globalSearchInput) {
    globalSearchInput.addEventListener('input', e => {
      App.ui.globalSearchQuery = e.target.value;
      App.ui.searchDropdownOpen = Boolean(e.target.value.trim());
      const root = document.getElementById('global-search-dropdown-root');
      if (root) root.innerHTML = renderGlobalSearchDropdown();
    });
    globalSearchInput.addEventListener('focus', e => {
      if (e.target.value.trim()) {
        App.ui.searchDropdownOpen = true;
        const root = document.getElementById('global-search-dropdown-root');
        if (root) root.innerHTML = renderGlobalSearchDropdown();
      }
    });
  }

  if (window.__studyos_events_bound) {
    renderApp();
    return;
  }
  window.__studyos_events_bound = true;

  // Delegated click handler for all buttons and interactive cards
  document.addEventListener('click', e => {
    const navBtn = e.target.closest('[data-nav-section]');
    if (navBtn) {
      App.ui.activeSection = navBtn.getAttribute('data-nav-section');
      App.ui.mobileSidebarOpen = false;
      App.ui.selectedSubjectId = null;
      renderApp();
      return;
    }

    const actionEl = e.target.closest('[data-action]');
    if (!actionEl) return;
    const action = actionEl.getAttribute('data-action');

    switch (action) {
      case 'toggle-sidebar':
        App.ui.sidebarCollapsed = !App.ui.sidebarCollapsed;
        renderApp();
        break;
      case 'toggle-mobile-sidebar':
        App.ui.mobileSidebarOpen = !App.ui.mobileSidebarOpen;
        renderApp();
        break;
      case 'toggle-theme':
        App.state.preferences.theme = App.state.preferences.theme === 'dark' ? 'light' : 'dark';
        saveAndRender();
        break;
      case 'nav-section':
        App.ui.activeSection = actionEl.getAttribute('data-section') || 'dashboard';
        App.ui.selectedSubjectId = null;
        renderApp();
        break;
      case 'close-global-search':
        App.ui.searchDropdownOpen = false;
        renderApp();
        break;
      case 'search-jump': {
        const type = actionEl.getAttribute('data-type');
        const id = actionEl.getAttribute('data-id');
        App.ui.searchDropdownOpen = false;
        if (type === 'subject') {
          App.ui.activeSection = 'subjects';
          App.ui.selectedSubjectId = id;
        } else if (type === 'task') {
          App.ui.activeSection = 'tasks';
          const task = (App.state.tasks || []).find(t => t.id === id);
          if (task) App.ui.modal = { type: 'task', data: task };
        } else if (type === 'note') {
          App.ui.activeSection = 'notes';
          App.ui.notes.selectedNoteId = id;
        } else if (type === 'deck') {
          App.ui.activeSection = 'flashcards';
          App.ui.flashcards.activeDeckId = id;
          App.ui.flashcards.mode = 'manage';
        } else if (type === 'exam') {
          App.ui.activeSection = 'exams';
        }
        renderApp();
        break;
      }
      case 'load-demo-workspace':
        // CRITICAL #2: Always require confirmation dialog before loading sample data
        requestLoadDemoWorkspace();
        break;
      case 'dismiss-onboarding':
        App.state.onboardingDismissed = true;
        saveAndRender();
        break;
      case 'start-quick-focus':
        App.ui.activeSection = 'timer';
        renderApp();
        break;
      case 'close-modal':
        App.ui.modal = null;
        renderOverlays();
        break;
      case 'cancel-confirm-dialog':
        App.ui.confirmDialog = null;
        renderOverlays();
        break;
      case 'execute-confirm-dialog':
        if (App.ui.confirmDialog && typeof App.ui.confirmDialog.onConfirm === 'function') {
          const fn = App.ui.confirmDialog.onConfirm;
          App.ui.confirmDialog = null;
          fn();
        }
        break;

      // Subjects Actions
      case 'open-subject-modal':
        App.ui.modal = { type: 'subject', data: {} };
        renderOverlays();
        break;
      case 'edit-subject': {
        const sub = getSubjectById(actionEl.getAttribute('data-subject-id'));
        if (sub) {
          App.ui.modal = { type: 'subject', data: sub };
          renderOverlays();
        }
        break;
      }
      case 'open-subject-detail':
        App.ui.activeSection = 'subjects';
        App.ui.selectedSubjectId = actionEl.getAttribute('data-subject-id');
        renderApp();
        break;
      case 'close-subject-detail':
        App.ui.selectedSubjectId = null;
        renderApp();
        break;
      case 'archive-subject': {
        const sub = getSubjectById(actionEl.getAttribute('data-subject-id'));
        if (sub) {
          sub.archived = !sub.archived;
          sub.updatedAt = new Date().toISOString();
          saveAndRender(sub.archived ? `Archived "${sub.name}". Associated records remain intact.` : `Restored "${sub.name}".`, 'info');
        }
        break;
      }
      case 'delete-subject': {
        const subId = actionEl.getAttribute('data-subject-id');
        const sub = getSubjectById(subId);
        if (!sub) break;
        openConfirmModal({
          title: `Delete Subject "${sub.name}"?`,
          message: 'This will remove the subject and its chapter list. Associated tasks, scheduled sessions, flashcards, decks, notes, focus history, and exams will be preserved as General/Unassigned records.',
          confirmLabel: 'Delete Subject Safely',
          onConfirm: () => {
            // MEDIUM #11: Clear subjectId (and chapterId) across ALL collections including scheduledSessions and flashcards
            App.state.subjects = (App.state.subjects || []).filter(s => s.id !== subId);
            App.state.chapters = (App.state.chapters || []).filter(c => c.subjectId !== subId);
            (App.state.tasks || []).forEach(t => { if (t.subjectId === subId) { t.subjectId = null; t.chapterId = null; } });
            (App.state.scheduledSessions || []).forEach(ss => { if (ss.subjectId === subId) ss.subjectId = null; });
            (App.state.notes || []).forEach(n => { if (n.subjectId === subId) { n.subjectId = null; n.chapterId = null; } });
            (App.state.flashcardDecks || []).forEach(d => { if (d.subjectId === subId) { d.subjectId = null; d.chapterId = null; } });
            (App.state.flashcards || []).forEach(fc => { if (fc.subjectId === subId) { fc.subjectId = null; fc.chapterId = null; } });
            (App.state.focusSessions || []).forEach(fs => { if (fs.subjectId === subId) fs.subjectId = null; });
            (App.state.exams || []).forEach(ex => { if (ex.subjectId === subId) { ex.subjectId = null; ex.chapterIds = []; } });
            if (App.ui.selectedSubjectId === subId) App.ui.selectedSubjectId = null;
            saveAndRender(`Deleted subject "${sub.name}" and cleared subject references.`, 'info');
          }
        });
        break;
      }
      case 'set-chapter-status': {
        const chId = actionEl.getAttribute('data-chapter-id');
        const status = actionEl.getAttribute('data-status');
        const ch = getChapterById(chId);
        if (ch && status) {
          ch.status = status;
          saveAndRender();
        }
        break;
      }
      case 'delete-chapter': {
        const chId = actionEl.getAttribute('data-chapter-id');
        App.state.chapters = (App.state.chapters || []).filter(c => c.id !== chId);
        (App.state.tasks || []).forEach(t => { if (t.chapterId === chId) t.chapterId = null; });
        (App.state.flashcards || []).forEach(fc => { if (fc.chapterId === chId) fc.chapterId = null; });
        saveAndRender('Chapter removed.', 'info');
        break;
      }
      case 'start-subject-focus': {
        const subId = actionEl.getAttribute('data-subject-id');
        App.ui.timer.subjectId = subId || '';
        App.ui.activeSection = 'timer';
        renderApp();
        break;
      }

      // Tasks Actions
      case 'open-task-modal': {
        const preSub = actionEl.getAttribute('data-subject-id') || '';
        App.ui.modal = { type: 'task', data: { subjectId: preSub } };
        renderOverlays();
        break;
      }
      case 'open-task-detail': {
        const task = (App.state.tasks || []).find(t => t.id === actionEl.getAttribute('data-task-id'));
        if (task) {
          App.ui.modal = { type: 'task', data: task };
          renderOverlays();
        }
        break;
      }
      case 'toggle-task-complete': {
        const taskId = actionEl.getAttribute('data-task-id');
        const task = (App.state.tasks || []).find(t => t.id === taskId);
        if (task) {
          task.completed = !task.completed;
          task.completedAt = task.completed ? new Date().toISOString() : null;
          task.updatedAt = new Date().toISOString();
          saveAndRender(task.completed ? `Task "${task.title}" completed!` : `Task "${task.title}" reopened.`, 'success');
        }
        break;
      }
      case 'set-task-status-tab':
        App.ui.taskFilter.status = actionEl.getAttribute('data-status') || 'all';
        renderApp();
        break;
      case 'select-task-bulk': {
        const tid = actionEl.getAttribute('data-task-id');
        if (!tid) break;
        if (App.ui.selectedTaskIds.includes(tid)) {
          App.ui.selectedTaskIds = App.ui.selectedTaskIds.filter(x => x !== tid);
        } else {
          App.ui.selectedTaskIds.push(tid);
        }
        renderApp();
        break;
      }
      case 'bulk-complete-tasks': {
        const nowIso = new Date().toISOString();
        let count = 0;
        (App.state.tasks || []).forEach(t => {
          if (App.ui.selectedTaskIds.includes(t.id) && !t.completed) {
            t.completed = true;
            t.completedAt = nowIso;
            t.updatedAt = nowIso;
            count++;
          }
        });
        App.ui.selectedTaskIds = [];
        saveAndRender(`Marked ${count} task(s) completed.`, 'success');
        break;
      }
      case 'bulk-delete-tasks': {
        const count = App.ui.selectedTaskIds.length;
        openConfirmModal({
          title: `Delete ${count} Selected Task(s)?`,
          message: 'This action permanently deletes the selected tasks.',
          confirmLabel: 'Delete Tasks',
          onConfirm: () => {
            const toRemove = new Set(App.ui.selectedTaskIds);
            App.state.tasks = (App.state.tasks || []).filter(t => !toRemove.has(t.id));
            App.ui.selectedTaskIds = [];
            saveAndRender(`Deleted ${count} task(s).`, 'info');
          }
        });
        break;
      }
      case 'delete-task': {
        const tid = actionEl.getAttribute('data-task-id');
        const task = (App.state.tasks || []).find(t => t.id === tid);
        if (!task) break;
        openConfirmModal({
          title: `Delete Task "${task.title}"?`,
          message: 'Are you sure you want to permanently delete this task?',
          confirmLabel: 'Delete Task',
          onConfirm: () => {
            App.state.tasks = (App.state.tasks || []).filter(t => t.id !== tid);
            App.state.scheduledSessions = (App.state.scheduledSessions || []).filter(s => s.taskId !== tid);
            saveAndRender('Task deleted.', 'info');
          }
        });
        break;
      }
      case 'start-task-focus': {
        const tid = actionEl.getAttribute('data-task-id');
        const task = (App.state.tasks || []).find(t => t.id === tid);
        if (task) {
          App.ui.timer.subjectId = task.subjectId || '';
          App.ui.timer.taskId = task.id;
          App.ui.activeSection = 'timer';
          renderApp();
        }
        break;
      }

      // Smart Study Planner Actions
      case 'set-planner-view':
        App.ui.plannerView = actionEl.getAttribute('data-view') || 'daily';
        renderApp();
        break;
      case 'planner-set-today':
        App.ui.plannerSelectedDate = getLocalDateString(new Date(), App.state.preferences.timezone);
        renderApp();
        break;
      case 'open-schedule-modal': {
        const d = actionEl.getAttribute('data-date') || App.ui.plannerSelectedDate || getLocalDateString(new Date(), App.state.preferences.timezone);
        App.ui.modal = { type: 'schedule', data: { sessionDate: d } };
        renderOverlays();
        break;
      }
      case 'schedule-existing-task': {
        const tid = actionEl.getAttribute('data-task-id');
        const task = (App.state.tasks || []).find(t => t.id === tid);
        if (task) {
          App.ui.modal = {
            type: 'schedule',
            data: {
              taskId: task.id,
              subjectId: task.subjectId || '',
              title: task.title,
              durationMinutes: task.estimatedMinutes || 45,
              sessionDate: task.dueDate || getLocalDateString(new Date(), App.state.preferences.timezone),
              startTime: '10:00'
            }
          };
          renderOverlays();
        }
        break;
      }
      case 'edit-scheduled-session': {
        const sid = actionEl.getAttribute('data-session-id');
        const sess = (App.state.scheduledSessions || []).find(s => s.id === sid);
        if (sess) {
          App.ui.modal = { type: 'schedule', data: sess };
          renderOverlays();
        }
        break;
      }
      case 'delete-scheduled-session': {
        const sid = actionEl.getAttribute('data-session-id');
        const sess = (App.state.scheduledSessions || []).find(s => s.id === sid);
        if (!sess) break;
        openConfirmModal({
          title: 'Remove Scheduled Session?',
          message: `Remove "${sess.title}" from the study schedule? If linked to an unfinished task, the task itself will be preserved.`,
          confirmLabel: 'Remove Session',
          onConfirm: () => {
            if (sess.taskId) {
              const linked = (App.state.tasks || []).find(t => t.id === sess.taskId);
              if (linked) {
                linked.scheduledDate = null;
                linked.scheduledStartTime = null;
              }
            }
            App.state.scheduledSessions = (App.state.scheduledSessions || []).filter(s => s.id !== sid);
            saveAndRender('Scheduled session removed.', 'info');
          }
        });
        break;
      }
      case 'generate-smart-schedule': {
        const res = generateSmartSchedule(App.state);
        App.ui.proposedScheduleResult = res;
        renderApp();
        showToast(`Generated ${res.proposedSessions.length} proposed study session(s). Review before applying.`, 'info');
        break;
      }
      case 'apply-proposed-schedule': {
        const prop = App.ui.proposedScheduleResult;
        if (prop && Array.isArray(prop.proposedSessions)) {
          prop.proposedSessions.forEach(ps => {
            App.state.scheduledSessions.push(ps);
            if (ps.taskId) {
              const t = (App.state.tasks || []).find(x => x.id === ps.taskId);
              if (t && !t.scheduledDate) {
                t.scheduledDate = ps.sessionDate;
                t.scheduledStartTime = ps.startTime;
              }
            }
          });
          const count = prop.proposedSessions.length;
          App.ui.proposedScheduleResult = null;
          saveAndRender(`Applied ${count} session(s) to your Study Planner!`, 'success');
        }
        break;
      }
      case 'discard-proposed-schedule':
        App.ui.proposedScheduleResult = null;
        renderApp();
        break;
      case 'start-focus-from-session': {
        const sid = actionEl.getAttribute('data-session-id');
        const sess = (App.state.scheduledSessions || []).find(s => s.id === sid);
        if (sess) {
          App.ui.timer.mode = 'focus';
          App.ui.timer.subjectId = sess.subjectId || '';
          App.ui.timer.taskId = sess.taskId || '';
          App.ui.timer.targetDurationSec = Number(sess.durationMinutes || 45) * 60;
          App.ui.activeSection = 'timer';
          renderApp();
        }
        break;
      }

      // Focus Timer Actions
      case 'set-timer-mode': {
        if (App.ui.timer.status !== 'idle') break;
        const mode = actionEl.getAttribute('data-mode') || 'focus';
        App.ui.timer.mode = mode;
        const prefs = App.state.preferences;
        const mins = mode === 'focus' ? (prefs.focusDurationMinutes || 25) : mode === 'short_break' ? (prefs.shortBreakMinutes || 5) : (prefs.longBreakMinutes || 15);
        App.ui.timer.targetDurationSec = mins * 60;
        syncTimerLoop();
        renderApp();
        break;
      }
      case 'apply-custom-timer-minutes': {
        if (App.ui.timer.status !== 'idle') break;
        const inp = document.getElementById('timer-custom-minutes');
        const val = Math.max(1, Math.min(180, Number(inp ? inp.value : 25)));
        App.ui.timer.targetDurationSec = val * 60;
        syncTimerLoop();
        renderApp();
        showToast(`Timer duration set to ${val} minutes.`, 'info');
        break;
      }
      case 'timer-start':
        App.ui.timer.status = 'running';
        App.ui.timer.startedAtEpochMs = Date.now();
        App.ui.timer.accumulatedElapsedMs = 0;
        App.ui.timer.sessionStartedIso = new Date().toISOString();
        App.ui.timer.sessionId = generateId('focus');
        syncTimerLoop();
        renderApp();
        break;
      case 'timer-pause':
        if (App.ui.timer.status === 'running') {
          App.ui.timer.accumulatedElapsedMs += Math.max(0, Date.now() - (App.ui.timer.startedAtEpochMs || Date.now()));
          App.ui.timer.startedAtEpochMs = null;
          App.ui.timer.status = 'paused';
          syncTimerLoop();
          renderApp();
        }
        break;
      case 'timer-resume':
        if (App.ui.timer.status === 'paused') {
          App.ui.timer.startedAtEpochMs = Date.now();
          App.ui.timer.status = 'running';
          syncTimerLoop();
          renderApp();
        }
        break;
      case 'timer-complete':
        completeCurrentTimerSession(false);
        break;
      case 'timer-reset': {
        const elapsedSec = getTimerElapsedSeconds();
        const wasFocus = App.ui.timer.mode === 'focus';
        if (wasFocus && elapsedSec >= 60) {
          const startMs = getSessionStartMs(App.ui.timer, elapsedSec);
          App.state.focusSessions.push({
            id: App.ui.timer.sessionId || generateId('focus'),
            subjectId: App.ui.timer.subjectId || null,
            taskId: App.ui.timer.taskId || null,
            mode: 'focus',
            startTime: new Date(startMs).toISOString(),
            endTime: new Date().toISOString(),
            plannedMinutes: Math.round(App.ui.timer.targetDurationSec / 60),
            durationMinutes: Number((elapsedSec / 60).toFixed(2)),
            status: 'interrupted'
          });
        }
        App.ui.timer.status = 'idle';
        App.ui.timer.startedAtEpochMs = null;
        App.ui.timer.accumulatedElapsedMs = 0;
        App.ui.timer.sessionStartedIso = null;
        App.ui.timer.sessionId = null;
        syncTimerLoop();
        saveAndRender('Timer reset. Abandoned sessions are marked interrupted and excluded from study time.', 'warning');
        break;
      }
      case 'approve-focus-session': {
        const sid = actionEl.getAttribute('data-session-id');
        const fs = (App.state.focusSessions || []).find(s => s.id === sid);
        if (fs) {
          fs.status = 'completed';
          saveAndRender('Session confirmed and added to your completed study time!', 'success');
        }
        break;
      }
      case 'open-manual-session-modal':
        App.ui.modal = { type: 'focus_record', data: {} };
        renderOverlays();
        break;
      case 'edit-focus-session': {
        const sid = actionEl.getAttribute('data-session-id');
        const fs = (App.state.focusSessions || []).find(s => s.id === sid);
        if (fs) {
          App.ui.modal = { type: 'focus_record', data: fs };
          renderOverlays();
        }
        break;
      }
      case 'delete-focus-session': {
        const sid = actionEl.getAttribute('data-session-id');
        openConfirmModal({
          title: 'Remove Focus Session Record?',
          message: 'Deleting this session record will recalculate your study time and analytics.',
          confirmLabel: 'Remove Record',
          onConfirm: () => {
            App.state.focusSessions = (App.state.focusSessions || []).filter(s => s.id !== sid);
            saveAndRender('Focus session record removed.', 'info');
          }
        });
        break;
      }

      // Flashcards Actions
      case 'open-deck-modal': {
        const preSub = actionEl.getAttribute('data-subject-id') || '';
        App.ui.modal = { type: 'deck', data: { subjectId: preSub } };
        renderOverlays();
        break;
      }
      case 'open-deck-from-link':
        App.ui.activeSection = 'flashcards';
        App.ui.flashcards.activeDeckId = actionEl.getAttribute('data-deck-id');
        App.ui.flashcards.mode = 'manage';
        renderApp();
        break;
      case 'edit-deck': {
        const deck = (App.state.flashcardDecks || []).find(d => d.id === actionEl.getAttribute('data-deck-id'));
        if (deck) {
          App.ui.modal = { type: 'deck', data: deck };
          renderOverlays();
        }
        break;
      }
      case 'delete-deck': {
        const did = actionEl.getAttribute('data-deck-id');
        const deck = (App.state.flashcardDecks || []).find(d => d.id === did);
        if (!deck) break;
        openConfirmModal({
          title: `Delete Deck "${deck.title}"?`,
          message: 'This will permanently delete the deck and its flashcards.',
          confirmLabel: 'Delete Deck',
          onConfirm: () => {
            App.state.flashcardDecks = (App.state.flashcardDecks || []).filter(d => d.id !== did);
            App.state.flashcards = (App.state.flashcards || []).filter(c => c.deckId !== did);
            saveAndRender('Flashcard deck deleted.', 'info');
          }
        });
        break;
      }
      case 'manage-deck-cards':
        App.ui.flashcards.activeDeckId = actionEl.getAttribute('data-deck-id');
        App.ui.flashcards.mode = 'manage';
        renderApp();
        break;
      case 'exit-deck-subview':
        App.ui.flashcards.activeDeckId = null;
        App.ui.flashcards.mode = 'list';
        renderApp();
        break;
      case 'open-card-modal':
        App.ui.modal = { type: 'card', data: { deckId: actionEl.getAttribute('data-deck-id') || App.ui.flashcards.activeDeckId } };
        renderOverlays();
        break;
      case 'edit-card': {
        const card = (App.state.flashcards || []).find(c => c.id === actionEl.getAttribute('data-card-id'));
        if (card) {
          App.ui.modal = { type: 'card', data: card };
          renderOverlays();
        }
        break;
      }
      case 'delete-card': {
        const cid = actionEl.getAttribute('data-card-id');
        openConfirmModal({
          title: 'Delete Flashcard?',
          message: 'Remove this flashcard from the deck?',
          confirmLabel: 'Delete Card',
          onConfirm: () => {
            App.state.flashcards = (App.state.flashcards || []).filter(c => c.id !== cid);
            saveAndRender('Flashcard deleted.', 'info');
          }
        });
        break;
      }
      case 'start-deck-review': {
        const did = actionEl.getAttribute('data-deck-id');
        const filter = actionEl.getAttribute('data-filter') || 'all';
        const todayStr = getLocalDateString(new Date(), App.state.preferences.timezone);
        let cards = (App.state.flashcards || []).filter(c => c.deckId === did);
        if (filter === 'due') {
          cards = cards.filter(c => !c.nextReviewDate || c.nextReviewDate <= todayStr);
        }
        App.ui.flashcards.activeDeckId = did;
        App.ui.flashcards.mode = 'review';
        App.ui.flashcards.reviewFilter = filter;
        App.ui.flashcards.cardsQueue = cards.slice();
        App.ui.flashcards.currentIndex = 0;
        App.ui.flashcards.isFlipped = false;
        renderApp();
        break;
      }
      case 'flip-current-card':
        App.ui.flashcards.isFlipped = !App.ui.flashcards.isFlipped;
        renderApp();
        break;
      case 'shuffle-review-cards': {
        const q = App.ui.flashcards.cardsQueue.slice();
        for (let i = q.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [q[i], q[j]] = [q[j], q[i]];
        }
        App.ui.flashcards.cardsQueue = q;
        App.ui.flashcards.currentIndex = 0;
        App.ui.flashcards.isFlipped = false;
        renderApp();
        showToast('Cards shuffled.', 'info');
        break;
      }
      case 'rate-flashcard': {
        const rating = actionEl.getAttribute('data-rating') || 'medium';
        const fc = App.ui.flashcards;
        const current = fc.cardsQueue[fc.currentIndex];
        if (current) {
          const todayStr = getLocalDateString(new Date(), App.state.preferences.timezone);
          const updatedFields = calculateSpacedRepetition(current, rating, todayStr);
          const storedCard = (App.state.flashcards || []).find(c => c.id === current.id);
          if (storedCard) {
            Object.assign(storedCard, updatedFields);
          }
          App.state.flashcardReviews.push({
            id: generateId('rev'),
            cardId: current.id,
            deckId: current.deckId,
            rating,
            wasCorrect: rating !== 'hard',
            reviewedAt: new Date().toISOString()
          });
        }
        fc.currentIndex += 1;
        fc.isFlipped = false;
        saveAndRender();
        break;
      }
      case 'start-deck-quiz': {
        const did = actionEl.getAttribute('data-deck-id');
        const cards = (App.state.flashcards || []).filter(c => c.deckId === did);
        App.ui.flashcards.activeDeckId = did;
        App.ui.flashcards.mode = 'quiz';
        App.ui.flashcards.cardsQueue = cards.slice();
        App.ui.flashcards.currentIndex = 0;
        App.ui.flashcards.quizAnswers = [];
        renderApp();
        break;
      }

      // Notes Actions
      case 'quick-new-note':
      case 'create-new-note': {
        const preSub = actionEl.getAttribute('data-subject-id') || null;
        const newNote = {
          id: generateId('note'),
          subjectId: preSub,
          chapterId: null,
          title: 'Untitled Study Note',
          content: '# Study Note\n\nWrite key concepts, formulas, and summaries here.',
          attachments: [],
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };
        App.state.notes.unshift(newNote);
        App.ui.activeSection = 'notes';
        App.ui.notes.selectedNoteId = newNote.id;
        saveAndRender('New note created.', 'success');
        break;
      }
      case 'open-note-from-link':
      case 'select-note':
        App.ui.activeSection = 'notes';
        App.ui.notes.selectedNoteId = actionEl.getAttribute('data-note-id');
        renderApp();
        break;
      case 'set-note-editor-mode':
        App.ui.notes.editorMode = actionEl.getAttribute('data-mode') || 'split';
        renderApp();
        break;
      case 'note-format': {
        const snippet = actionEl.getAttribute('data-snippet') || '';
        const activeNote = (App.state.notes || []).find(n => n.id === App.ui.notes.selectedNoteId);
        if (activeNote) {
          activeNote.content = `${activeNote.content || ''}\n${snippet}`;
          activeNote.updatedAt = new Date().toISOString();
          saveAndRender();
        }
        break;
      }
      case 'append-attachment-to-note': {
        const idx = Number(actionEl.getAttribute('data-index'));
        const activeNote = (App.state.notes || []).find(n => n.id === App.ui.notes.selectedNoteId);
        const att = activeNote && activeNote.attachments && activeNote.attachments[idx];
        if (activeNote && att && att.extractedText) {
          activeNote.content = `${activeNote.content}\n\n## Imported from ${att.name}\n${att.extractedText}`;
          activeNote.updatedAt = new Date().toISOString();
          saveAndRender(`Inserted text from "${att.name}" into note.`, 'success');
        }
        break;
      }
      case 'remove-note-attachment': {
        const idx = Number(actionEl.getAttribute('data-index'));
        const activeNote = (App.state.notes || []).find(n => n.id === App.ui.notes.selectedNoteId);
        if (activeNote && Array.isArray(activeNote.attachments)) {
          activeNote.attachments.splice(idx, 1);
          saveAndRender('Attachment removed.', 'info');
        }
        break;
      }
      case 'delete-note': {
        const nid = actionEl.getAttribute('data-note-id');
        const note = (App.state.notes || []).find(n => n.id === nid);
        if (!note) break;
        openConfirmModal({
          title: `Delete Note "${note.title}"?`,
          message: 'Are you sure you want to permanently delete this note?',
          confirmLabel: 'Delete Note',
          onConfirm: () => {
            App.state.notes = (App.state.notes || []).filter(n => n.id !== nid);
            App.ui.notes.selectedNoteId = App.state.notes[0] ? App.state.notes[0].id : null;
            saveAndRender('Note deleted.', 'info');
          }
        });
        break;
      }

      // Exams Actions
      case 'open-exam-modal':
        App.ui.modal = { type: 'exam', data: {} };
        renderOverlays();
        break;
      case 'edit-exam': {
        const ex = (App.state.exams || []).find(x => x.id === actionEl.getAttribute('data-exam-id'));
        if (ex) {
          App.ui.modal = { type: 'exam', data: ex };
          renderOverlays();
        }
        break;
      }
      case 'toggle-exam-complete': {
        const ex = (App.state.exams || []).find(x => x.id === actionEl.getAttribute('data-exam-id'));
        if (ex) {
          ex.status = ex.status === 'completed' ? 'in_progress' : 'completed';
          ex.updatedAt = new Date().toISOString();
          saveAndRender(`Exam marked ${ex.status}.`, 'success');
        }
        break;
      }
      case 'delete-exam': {
        const exId = actionEl.getAttribute('data-exam-id');
        const ex = (App.state.exams || []).find(x => x.id === exId);
        if (!ex) break;
        openConfirmModal({
          title: `Delete Exam "${ex.name}"?`,
          message: 'Are you sure you want to remove this exam from the tracker?',
          confirmLabel: 'Delete Exam',
          onConfirm: () => {
            App.state.exams = (App.state.exams || []).filter(x => x.id !== exId);
            saveAndRender('Exam removed.', 'info');
          }
        });
        break;
      }

      // Local Study Tools Actions
      case 'clear-ai-history':
        App.state.aiHistory = [];
        App.ui.assistant.lastGeneratedCards = [];
        saveAndRender();
        break;
      case 'save-ai-cards-to-deck': {
        const cards = App.ui.assistant.lastGeneratedCards || [];
        if (cards.length === 0) break;
        let targetDeck = App.state.flashcardDecks[0];
        if (!targetDeck) {
          targetDeck = {
            id: generateId('deck'),
            subjectId: null,
            chapterId: null,
            title: 'Extracted Study Deck',
            description: 'Created from study notes via Local Study Tools.',
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString()
          };
          App.state.flashcardDecks.push(targetDeck);
        }
        const todayStr = getLocalDateString(new Date(), App.state.preferences.timezone);
        cards.forEach(c => {
          App.state.flashcards.push({
            id: generateId('card'),
            deckId: targetDeck.id,
            subjectId: targetDeck.subjectId,
            chapterId: null,
            question: c.question,
            answer: c.answer,
            explanation: c.explanation || '',
            difficulty: 'unrated',
            intervalDays: 0,
            easeFactor: 2.5,
            repetitions: 0,
            nextReviewDate: todayStr
          });
        });
        App.ui.assistant.lastGeneratedCards = [];
        saveAndRender(`Saved ${cards.length} flashcards to "${targetDeck.title}"!`, 'success');
        break;
      }

      // Settings, Disk Sync & Backup Actions
      case 'reset-default-preferences':
        openConfirmModal({
          title: 'Reset Preferences to Defaults?',
          message: 'This will restore default timer lengths, study goals, and theme settings without deleting your study records.',
          confirmLabel: 'Reset Preferences',
          danger: false,
          onConfirm: () => {
            App.state.preferences = createDefaultPreferences();
            saveAndRender('Preferences restored to default values.', 'success');
          }
        });
        break;
      case 'export-json-data':
        exportWorkspaceJsonBackup();
        break;
      case 'trigger-import-json': {
        App.ui.modal = null;
        App.ui.activeSection = 'settings';
        renderApp();
        const imp = document.getElementById('import-json-input');
        if (imp) imp.click();
        break;
      }
      case 'open-windows-app-modal':
        App.ui.modal = { type: 'windows_app', data: {} };
        renderOverlays();
        break;
      case 'toggle-compact-widget':
        App.ui.compactWidgetMode = !App.ui.compactWidgetMode;
        document.body.classList.toggle('compact-widget-mode', Boolean(App.ui.compactWidgetMode));
        if (App.ui.compactWidgetMode) {
          App.ui.activeSection = 'timer';
        }
        App.ui.modal = null;
        renderApp();
        showToast(App.ui.compactWidgetMode ? 'Switched to Compact Desktop Timer Widget mode.' : 'Restored full desktop workspace.', 'info');
        break;
      case 'toggle-fullscreen-window':
        if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else if (document.exitFullscreen && document.fullscreenElement) {
          document.exitFullscreen().catch(() => {});
        }
        break;
      case 'win-connect-disk-file':
        connectOrSaveWindowsDiskFile();
        break;
      case 'win-open-disk-file':
        openWindowsDiskFile();
        break;
      case 'reconnect-disk-file':
        reconnectRememberedDiskFile();
        break;

      case 'clear-all-data':
        openConfirmModal({
          title: 'Delete All Personal Study Data?',
          message: 'This will permanently erase all subjects, tasks, scheduled sessions, focus logs, flashcards, notes, and exams from local storage.',
          confirmLabel: 'Erase All Data',
          onConfirm: () => {
            App.state = createEmptyState();
            App.ui.selectedSubjectId = null;
            App.ui.notes.selectedNoteId = null;
            App.ui.flashcards.activeDeckId = null;
            saveAndRender('All workspace data has been erased.', 'warning');
          }
        });
        break;
    }
  });

  // Delegated Form Submit Handler
  document.addEventListener('submit', e => {
    const form = e.target;
    const formId = form && form.getAttribute ? form.getAttribute('id') : '';
    if (!formId) return;
    e.preventDefault();
    const fd = new FormData(form);

    if (formId === 'onboarding-name-form') {
      const displayName = String(fd.get('displayName') || '').trim();
      const academicProgram = String(fd.get('academicProgram') || '').trim();
      if (!displayName) {
        showToast('Please enter your name.', 'warning');
        return;
      }
      App.state.profile.displayName = displayName;
      if (academicProgram) App.state.profile.academicProgram = academicProgram;
      saveAndRender(`Welcome, ${displayName}!`, 'success');
      return;
    }

    if (formId === 'modal-subject-form') {
      const id = String(fd.get('id') || '').trim();
      const name = String(fd.get('name') || '').trim();
      if (!name) {
        showToast('Subject name is required.', 'danger');
        return;
      }
      if (id) {
        const existing = getSubjectById(id);
        if (existing) {
          existing.name = name;
          existing.description = String(fd.get('description') || '').trim();
          existing.targetGrade = String(fd.get('targetGrade') || 'A').trim();
          existing.examDate = String(fd.get('examDate') || '').trim() || null;
          existing.color = String(fd.get('color') || '#6366F1');
          existing.icon = String(fd.get('icon') || 'book');
          existing.updatedAt = new Date().toISOString();
        }
      } else {
        App.state.subjects.push({
          id: generateId('sub'),
          name,
          description: String(fd.get('description') || '').trim(),
          targetGrade: String(fd.get('targetGrade') || 'A').trim(),
          examDate: String(fd.get('examDate') || '').trim() || null,
          color: String(fd.get('color') || '#6366F1'),
          icon: String(fd.get('icon') || 'book'),
          archived: false,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        });
      }
      App.ui.modal = null;
      saveAndRender(id ? 'Subject updated.' : 'Subject created!', 'success');
    }

    if (formId === 'add-chapter-form') {
      const subjectId = String(fd.get('subjectId') || '').trim();
      const title = String(fd.get('chapterTitle') || '').trim();
      if (!subjectId || !title) return;
      const existingCount = (App.state.chapters || []).filter(c => c.subjectId === subjectId).length;
      App.state.chapters.push({
        id: generateId('ch'),
        subjectId,
        title,
        orderIndex: existingCount + 1,
        status: 'not_started'
      });
      saveAndRender(`Added chapter "${title}".`, 'success');
    }

    if (formId === 'modal-task-form') {
      const id = String(fd.get('id') || '').trim();
      const title = String(fd.get('title') || '').trim();
      const dueDate = String(fd.get('dueDate') || '').trim();
      if (!title || !dueDate) {
        showToast('Task title and due date are required.', 'danger');
        return;
      }
      const tags = String(fd.get('tags') || '')
        .split(',')
        .map(s => s.trim())
        .filter(Boolean);
      const schedDate = String(fd.get('scheduledDate') || '').trim() || null;
      const schedTime = String(fd.get('scheduledStartTime') || '').trim() || null;
      const estMin = Math.max(5, Number(fd.get('estimatedMinutes') || 45));
      const subjectId = String(fd.get('subjectId') || '').trim() || null;
      const rawChapterId = String(fd.get('chapterId') || '').trim() || null;
      // Verify chapter belongs to chosen subject
      const validChapter = rawChapterId && subjectId
        ? (App.state.chapters || []).find(c => c.id === rawChapterId && c.subjectId === subjectId)
        : null;
      const chapterId = validChapter ? validChapter.id : null;

      let taskId = id;
      if (id) {
        const existing = (App.state.tasks || []).find(t => t.id === id);
        if (existing) {
          existing.title = title;
          existing.description = String(fd.get('description') || '').trim();
          existing.subjectId = subjectId;
          existing.chapterId = chapterId;
          existing.priority = String(fd.get('priority') || 'medium');
          existing.dueDate = dueDate;
          existing.dueTime = String(fd.get('dueTime') || '').trim();
          existing.estimatedMinutes = estMin;
          existing.scheduledDate = schedDate;
          existing.scheduledStartTime = schedTime;
          existing.tags = tags;
          existing.updatedAt = new Date().toISOString();
        }
      } else {
        taskId = generateId('task');
        App.state.tasks.push({
          id: taskId,
          title,
          description: String(fd.get('description') || '').trim(),
          subjectId,
          chapterId,
          priority: String(fd.get('priority') || 'medium'),
          dueDate,
          dueTime: String(fd.get('dueTime') || '').trim(),
          estimatedMinutes: estMin,
          scheduledDate: schedDate,
          scheduledStartTime: schedTime,
          completed: false,
          completedAt: null,
          tags,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        });
      }

      if (schedDate && schedTime) {
        const existingSess = (App.state.scheduledSessions || []).find(s => s.taskId === taskId);
        if (existingSess) {
          existingSess.title = title;
          existingSess.subjectId = subjectId;
          existingSess.sessionDate = schedDate;
          existingSess.startTime = schedTime;
          existingSess.durationMinutes = estMin;
        } else {
          App.state.scheduledSessions.push({
            id: generateId('sched'),
            taskId,
            subjectId,
            title,
            sessionDate: schedDate,
            startTime: schedTime,
            durationMinutes: estMin,
            status: 'scheduled',
            notes: ''
          });
        }
      }

      App.ui.modal = null;
      saveAndRender(id ? 'Task updated.' : 'Task created!', 'success');
    }

    if (formId === 'modal-schedule-form') {
      const id = String(fd.get('id') || '').trim();
      const title = String(fd.get('title') || '').trim();
      const sessionDate = String(fd.get('sessionDate') || '').trim();
      const startTime = String(fd.get('startTime') || '').trim();
      const durationMinutes = Math.max(10, Number(fd.get('durationMinutes') || 45));
      const taskId = String(fd.get('taskId') || '').trim() || null;
      const subjectId = String(fd.get('subjectId') || '').trim() || null;
      const notes = String(fd.get('notes') || '').trim();

      if (!title || !sessionDate || !startTime) {
        showToast('Title, date, and start time are required.', 'danger');
        return;
      }

      if (id) {
        const existing = (App.state.scheduledSessions || []).find(s => s.id === id);
        if (existing) {
          Object.assign(existing, { title, sessionDate, startTime, durationMinutes, taskId, subjectId, notes });
        }
      } else {
        App.state.scheduledSessions.push({
          id: generateId('sched'),
          taskId,
          subjectId,
          title,
          sessionDate,
          startTime,
          durationMinutes,
          status: 'scheduled',
          notes
        });
      }

      if (taskId) {
        const linkedTask = (App.state.tasks || []).find(t => t.id === taskId);
        if (linkedTask) {
          linkedTask.scheduledDate = sessionDate;
          linkedTask.scheduledStartTime = startTime;
        }
      }

      App.ui.modal = null;
      saveAndRender('Study session scheduled.', 'success');
    }

    if (formId === 'modal-focus-record-form') {
      const id = String(fd.get('id') || '').trim();
      const subjectId = String(fd.get('subjectId') || '').trim() || null;
      const durationMinutes = Math.max(1, Number(fd.get('durationMinutes') || 25));
      const status = String(fd.get('status') || 'completed');

      if (id) {
        const existing = (App.state.focusSessions || []).find(s => s.id === id);
        if (existing) {
          existing.subjectId = subjectId;
          existing.durationMinutes = durationMinutes;
          existing.status = status;
        }
      } else {
        App.state.focusSessions.push({
          id: generateId('focus'),
          subjectId,
          taskId: null,
          mode: 'focus',
          startTime: new Date().toISOString(),
          endTime: new Date().toISOString(),
          plannedMinutes: durationMinutes,
          durationMinutes,
          status
        });
      }
      App.ui.modal = null;
      saveAndRender('Focus session record saved.', 'success');
    }

    if (formId === 'modal-deck-form') {
      const id = String(fd.get('id') || '').trim();
      const title = String(fd.get('title') || '').trim();
      const subjectId = String(fd.get('subjectId') || '').trim() || null;
      const description = String(fd.get('description') || '').trim();
      if (!title) return;

      if (id) {
        const deck = (App.state.flashcardDecks || []).find(d => d.id === id);
        if (deck) Object.assign(deck, { title, subjectId, description, updatedAt: new Date().toISOString() });
      } else {
        App.state.flashcardDecks.push({
          id: generateId('deck'),
          subjectId,
          chapterId: null,
          title,
          description,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        });
      }
      App.ui.modal = null;
      saveAndRender(id ? 'Deck updated.' : 'Flashcard deck created!', 'success');
    }

    if (formId === 'modal-card-form') {
      const id = String(fd.get('id') || '').trim();
      const deckId = String(fd.get('deckId') || '').trim();
      const question = String(fd.get('question') || '').trim();
      const answer = String(fd.get('answer') || '').trim();
      const explanation = String(fd.get('explanation') || '').trim();
      if (!deckId || !question || !answer) return;

      if (id) {
        const card = (App.state.flashcards || []).find(c => c.id === id);
        if (card) Object.assign(card, { question, answer, explanation });
      } else {
        const deck = (App.state.flashcardDecks || []).find(d => d.id === deckId);
        App.state.flashcards.push({
          id: generateId('card'),
          deckId,
          subjectId: deck ? deck.subjectId : null,
          chapterId: null,
          question,
          answer,
          explanation,
          difficulty: 'unrated',
          intervalDays: 0,
          easeFactor: 2.5,
          repetitions: 0,
          nextReviewDate: getLocalDateString(new Date(), App.state.preferences.timezone)
        });
      }
      App.ui.modal = null;
      saveAndRender(id ? 'Flashcard updated.' : 'Flashcard added to deck!', 'success');
    }

    if (formId === 'quiz-answer-form') {
      const userAnswer = String(fd.get('userAnswer') || '').trim();
      // HIGH #5: Reject empty answer
      if (!userAnswer) {
        showToast('Please enter a non-empty answer before submitting.', 'warning');
        return;
      }
      const fc = App.ui.flashcards;
      const card = fc.cardsQueue[fc.currentIndex];
      if (card) {
        const correct = gradeQuizResponse(userAnswer, card.answer);

        fc.quizAnswers.push({
          cardId: card.id,
          question: card.question,
          userAnswer,
          expectedAnswer: card.answer,
          correct
        });

        const todayStr = getLocalDateString(new Date(), App.state.preferences.timezone);
        const rating = correct ? 'easy' : 'hard';
        const stored = (App.state.flashcards || []).find(c => c.id === card.id);
        if (stored) {
          Object.assign(stored, calculateSpacedRepetition(stored, rating, todayStr));
        }
        App.state.flashcardReviews.push({
          id: generateId('rev'),
          cardId: card.id,
          deckId: card.deckId,
          rating,
          wasCorrect: correct,
          reviewedAt: new Date().toISOString()
        });
      }
      fc.currentIndex += 1;
      saveAndRender();
    }

    if (formId === 'modal-exam-form') {
      const id = String(fd.get('id') || '').trim();
      const name = String(fd.get('name') || '').trim();
      const subjectId = String(fd.get('subjectId') || '').trim() || null;
      const examDate = String(fd.get('examDate') || '').trim();
      const examTime = String(fd.get('examTime') || '09:00').trim();
      const description = String(fd.get('description') || '').trim();
      const notes = String(fd.get('notes') || '').trim();
      if (!name || !examDate) return;

      if (id) {
        const ex = (App.state.exams || []).find(x => x.id === id);
        if (ex) Object.assign(ex, { name, subjectId, examDate, examTime, description, notes, updatedAt: new Date().toISOString() });
      } else {
        App.state.exams.push({
          id: generateId('exam'),
          subjectId,
          name,
          examDate,
          examTime,
          description,
          chapterIds: [],
          status: 'in_progress',
          notes,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        });
      }
      App.ui.modal = null;
      saveAndRender(id ? 'Exam updated.' : 'Exam added to tracker!', 'success');
    }

    if (formId === 'ai-assistant-form') {
      const tool = String(fd.get('tool') || 'priorities');
      const noteId = String(fd.get('noteId') || '');
      const prompt = String(fd.get('prompt') || '').trim();
      App.ui.assistant.selectedTool = tool;
      App.ui.assistant.selectedNoteId = noteId;
      App.ui.assistant.promptInput = prompt;

      const result = runLocalAiAssistant(tool, noteId, prompt);
      App.state.aiHistory.push({
        id: generateId('ai'),
        tool,
        promptSummary: result.promptSummary,
        responseMarkdown: result.responseMarkdown,
        timestamp: new Date().toTimeString().slice(0, 8)
      });
      saveAndRender('Local Study Tool generated new study material.', 'success');
    }

    if (formId === 'settings-preferences-form') {
      const rawTz = String(fd.get('timezone') || '').trim();
      // MEDIUM #12: Validate timezone setting with Intl.DateTimeFormat and reject invalid values
      if (!isValidTimeZone(rawTz)) {
        showToast(`Invalid timezone "${rawTz}". Please enter a valid IANA timezone (e.g. UTC, America/New_York, Europe/London).`, 'danger');
        return;
      }

      const p = App.state.preferences;
      p.theme = String(fd.get('theme') || 'dark');
      p.timezone = rawTz;
      p.dailyStudyGoalMinutes = Math.max(15, Number(fd.get('dailyStudyGoalMinutes') || 120));
      p.weeklyStudyGoalMinutes = Math.max(60, Number(fd.get('weeklyStudyGoalMinutes') || 600));
      p.focusDurationMinutes = Math.max(1, Number(fd.get('focusDurationMinutes') || 25));
      p.shortBreakMinutes = Math.max(1, Number(fd.get('shortBreakMinutes') || 5));
      p.longBreakMinutes = Math.max(1, Number(fd.get('longBreakMinutes') || 15));
      p.defaultSessionMinutes = Math.max(15, Number(fd.get('defaultSessionMinutes') || 45));
      p.availableDailyHours = Math.max(0.5, Number(fd.get('availableDailyHours') || 4));
      p.weekStartsOn = String(fd.get('weekStartsOn') || 'monday');
      p.studyWindowStart = String(fd.get('studyWindowStart') || '09:00');
      p.studyWindowEnd = String(fd.get('studyWindowEnd') || '20:00');
      p.autoTransitionTimer = fd.has('autoTransitionTimer');
      p.soundNotifications = fd.has('soundNotifications');

      if (App.ui.timer.status === 'idle' && App.ui.timer.mode === 'focus') {
        App.ui.timer.targetDurationSec = p.focusDurationMinutes * 60;
      }
      saveAndRender('Preferences saved and applied!', 'success');
    }

    if (formId === 'settings-profile-form') {
      const displayName = String(fd.get('displayName') || '').trim();
      if (!displayName) {
        showToast('Display name cannot be empty.', 'danger');
        return;
      }
      App.state.profile.displayName = displayName;
      App.state.profile.academicProgram = String(fd.get('academicProgram') || '').trim();
      saveAndRender('Student profile updated.', 'success');
    }
  });

  // Keyboard shortcuts (non-interfering with inputs)
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (App.ui.confirmDialog || App.ui.modal || App.ui.searchDropdownOpen) {
        App.ui.confirmDialog = null;
        App.ui.modal = null;
        App.ui.searchDropdownOpen = false;
        renderApp();
      }
      return;
    }
    const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
    const isTyping = tag === 'input' || tag === 'textarea' || tag === 'select' || (e.target && e.target.isContentEditable);
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
      e.preventDefault();
      connectOrSaveWindowsDiskFile();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'o') {
      e.preventDefault();
      openWindowsDiskFile();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      const sInput = document.getElementById('global-search-input');
      if (sInput) sInput.focus();
    } else if (!isTyping && e.key === '/') {
      e.preventDefault();
      const sInput = document.getElementById('global-search-input');
      if (sInput) sInput.focus();
    }
  });

  renderApp();
}

window.addEventListener('DOMContentLoaded', initStudyOSApp);


// Register Service Worker for Offline PWA Support when served over HTTP(S)
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
  </script>
</body>
</html>
